<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — Sales Strategy</title>
<script src="auth.js"></script>
<script>apGuard("sales-strategy");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1C6B6E;--teal-light:#2A8A8E;--teal-dark:#0F4547;
  --black:#111110;--off-black:#1A1A18;--charcoal:#2A2A28;--mid:#3A3A37;
  --grey:#6B6B67;--light-grey:#9A9A95;--white:#FFFFFF;
  --border:rgba(255,255,255,0.08);--radius:8px;--radius-lg:14px;
}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--black);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--off-black)}
::-webkit-scrollbar-thumb{background:var(--teal)}

nav{position:sticky;top:0;z-index:100;background:var(--black);border-bottom:1px solid rgba(28,107,110,0.35)}
.nav-inner{max-width:900px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-wordmark{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--white);line-height:1}
.nav-wordmark small{display:block;font-size:9px;font-weight:400;letter-spacing:.18em;color:var(--teal-light);margin-top:2px}
.nav-right{display:flex;align-items:center;gap:1.5rem}
.nav-user{font-size:12px;color:var(--light-grey)}
.nav-user b{color:var(--white);font-weight:600}
.logout-btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);background:none;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:8px 16px;cursor:pointer;transition:all .2s}
.logout-btn:hover{color:var(--white);border-color:rgba(255,255,255,0.35)}
.back-link{display:inline-flex;align-items:center;gap:6px;font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-light);text-decoration:none;margin-bottom:1.5rem}
.back-link:hover{color:var(--white)}

.wrap{max-width:900px;margin:0 auto;padding:3.5rem 2rem 6rem}
.eyebrow{font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-light);margin-bottom:.75rem;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--teal);flex-shrink:0}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700;text-transform:uppercase;line-height:1.1;margin-bottom:.5rem}
.sub{font-size:.9375rem;color:rgba(255,255,255,0.5);margin-bottom:2.5rem;max-width:620px;line-height:1.7}

.top-bar{display:flex;justify-content:flex-end;margin-bottom:1.5rem}
.add-section-btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--white);background:var(--teal);border:none;border-radius:6px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s}
.add-section-btn:hover{background:var(--teal-light)}

.sections{display:flex;flex-direction:column;gap:1.25rem}
.section-card{background:var(--off-black);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.section-head{display:flex;align-items:center;gap:.75rem;padding:1.1rem 1.25rem;cursor:pointer;user-select:none}
.section-head:hover{background:rgba(255,255,255,0.02)}
.section-chevron{color:var(--teal-light);font-size:11px;flex-shrink:0;transition:transform .2s;width:14px;text-align:center}
.section-card.collapsed .section-chevron{transform:rotate(-90deg)}
.section-title-input{flex:1;background:none;border:none;outline:none;color:var(--white);font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:4px 0}
.section-title-input::placeholder{color:rgba(255,255,255,0.3)}
.section-count{font-size:11px;color:var(--grey);flex-shrink:0}
.section-del{background:none;border:none;color:rgba(255,255,255,0.25);font-size:16px;cursor:pointer;padding:4px 6px;line-height:1;flex-shrink:0;transition:color .2s}
.section-del:hover{color:#c65b52}

.section-body{padding:0 1.25rem 1.5rem}
.section-card.collapsed .section-body{display:none}

.subhead{font-family:'Oswald',sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);margin:1rem 0 .6rem}

.bullets{display:flex;flex-direction:column;gap:.5rem}
.bullet-row{display:flex;align-items:flex-start;gap:.6rem}
.bullet-dot{color:var(--teal-light);font-size:1.1rem;line-height:1.6;flex-shrink:0;padding-top:1px}
.bullet-text{flex:1;background:var(--charcoal);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:.875rem;line-height:1.6;padding:.55rem .75rem;resize:none;overflow:hidden;font-family:inherit}
.bullet-text::placeholder{color:rgba(255,255,255,0.3)}
.bullet-text:focus{outline:none;border-color:var(--teal)}
.bullet-del{background:none;border:none;color:rgba(255,255,255,0.25);font-size:15px;cursor:pointer;padding:6px;line-height:1;flex-shrink:0;transition:color .2s}
.bullet-del:hover{color:#c65b52}
.add-bullet-btn{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-light);background:none;border:1px dashed rgba(42,138,142,0.4);border-radius:6px;padding:7px 12px;cursor:pointer;margin-top:.6rem;transition:all .2s}
.add-bullet-btn:hover{border-color:var(--teal-light);background:rgba(28,107,110,0.08)}

.notes-box{width:100%;background:var(--charcoal);border:1px solid var(--border);border-radius:6px;color:rgba(255,255,255,0.85);font-size:.875rem;line-height:1.7;padding:.75rem .85rem;resize:vertical;min-height:70px;font-family:inherit}
.notes-box::placeholder{color:rgba(255,255,255,0.3)}
.notes-box:focus{outline:none;border-color:var(--teal)}

.meta-row{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.25rem;border-top:1px solid var(--border);font-size:10.5px;color:rgba(255,255,255,0.25)}

.empty{background:var(--off-black);border:1px dashed rgba(255,255,255,0.1);border-radius:var(--radius-lg);padding:4rem 2rem;text-align:center;color:rgba(255,255,255,0.35);font-size:.9rem}
.saved-flag{position:fixed;bottom:20px;right:20px;background:var(--teal);color:#fff;font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:9px 16px;border-radius:6px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:500}
.saved-flag.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="nav-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div class="nav-wordmark">Alpine HVAC<small>Internal Portal</small></div>
    </div>
    <div class="nav-right">
      <span class="nav-user">Signed in as <b id="nav-user-name"></b></span>
      <button class="logout-btn" onclick="apLogout()">Sign Out</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <a class="back-link" href="dashboard.html?cat=sales">&larr; Sales Tools</a>
  <div class="eyebrow">Sales</div>
  <h1>Sales Strategy</h1>
  <p class="sub">A living playbook for uncovering value and closing sales — service agreements and jobs alike. Add sections as we get feedback from the BDR and the market; everyone on sales sees the same version.</p>

  <div class="top-bar">
    <button class="add-section-btn" onclick="ssAddSection()">+ Add Section</button>
  </div>

  <div class="sections" id="ss-sections"></div>
</div>

<div class="saved-flag" id="ss-saved-flag">Saved</div>

<script>
window.AP_SYNC_COLLECTION = "sales_strategy_data";
window.AP_APP_SCRIPT = "sales-strategy-app.js";
const __session = apGetSession();
document.getElementById("nav-user-name").textContent = __session ? __session.name : "";
</script>
<script type="module" src="cloud-sync.js"></script>
</body>
</html>
