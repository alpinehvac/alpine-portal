<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — Site Reports</title>
<script src="auth.js"></script>
<script>apGuard("site-reports");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#27636C;--teal-light:#3D818A;--teal-dark:#10444E;
  --purple:#6C5D8D;--purple-light:#8A7BB0;
  --black:#EAF2F3;--off-black:#FFFFFF;--charcoal:#E4F0F1;
  --white:#10444E;--red:#B83227;--amber:#A9821F;--green:#2E7D57;
  --border:rgba(16,68,78,0.12);--radius:8px;--radius-lg:14px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--black);color:var(--white);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--teal);color:#FFFFFF}

.tab-bar{position:sticky;top:0;z-index:300;background:var(--black);border-bottom:1px solid rgba(28,107,110,0.35);display:flex;align-items:center;gap:.6rem;padding:0 1rem;min-height:60px;flex-wrap:wrap}
.tab-logo-text{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1;margin-right:1rem}
.tab-logo-text small{display:block;font-size:8px;font-weight:400;letter-spacing:.16em;color:var(--teal-light);margin-top:2px}
.sel,.inp{background:var(--charcoal);border:1px solid rgba(16,68,78,0.168);border-radius:6px;padding:.42rem .65rem;font-size:.84rem}
.seg{display:inline-flex;border:1px solid rgba(16,68,78,0.21);border-radius:6px;overflow:hidden}
.seg button{background:none;border:none;padding:.42rem .9rem;font-size:.8rem;cursor:pointer;color:rgba(16,68,78,0.78)}
.seg button.on{background:var(--teal);color:#FFFFFF}
.bar-btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid rgba(16,68,78,0.168);color:rgba(16,68,78,0.65);border-radius:4px;padding:0 12px;height:32px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.bar-btn:hover{color:var(--teal-light);border-color:rgba(28,107,110,0.6)}
.spacer{flex:1}

.wrap{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 5rem}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:700;text-transform:uppercase;line-height:1.1}
.sub{font-size:.85rem;color:rgba(16,68,78,0.585);margin:.3rem 0 1.5rem}
h2{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:2rem 0 .75rem}
.muted{color:rgba(16,68,78,0.52)}
.btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:.45rem .9rem;cursor:pointer;border:1px solid rgba(16,68,78,0.21);background:none;color:rgba(16,68,78,0.92)}
.btn:hover{border-color:rgba(16,68,78,0.455);color:var(--white)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#FFFFFF}
.btn.sm{padding:.25rem .55rem;font-size:10px}

/* progress header */
.qhead{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--off-black);overflow:hidden}
.qhead > div{padding:1rem 1.25rem;border-right:1px solid var(--border)}
.qhead > div:last-child{border-right:none}
.k-label{font-size:.74rem;color:rgba(16,68,78,0.585)}
.k-val{font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:600;line-height:1.25}
.k-foot{font-size:.72rem;color:rgba(16,68,78,0.494)}
.bigbar{height:8px;border-radius:99px;background:rgba(16,68,78,0.112);overflow:hidden;margin-top:.5rem;display:flex}
.bigbar i{display:block;height:100%}
.f-done{background:var(--teal-light);color:#FFFFFF}.f-issue{background:var(--red);color:#FFFFFF}.f-na{background:rgba(155,142,196,0.5)}

/* maintenance items */
.item{border:1px solid var(--border);border-radius:var(--radius);background:var(--off-black);margin-bottom:.6rem}
.item-head{display:grid;grid-template-columns:1fr 120px 150px 110px 24px;gap:1rem;align-items:center;padding:.75rem 1rem;cursor:pointer}
.item-head:hover{background:rgba(28,107,110,0.06)}
.item-title{font-weight:500}
.item-meta{font-size:.74rem;color:rgba(16,68,78,0.546)}
.minibar{height:5px;border-radius:99px;background:rgba(16,68,78,0.112);overflow:hidden;display:flex}
.minibar i{display:block;height:100%}
.pct{font-family:'Oswald',sans-serif;font-size:1rem;text-align:right}
.chev{color:rgba(16,68,78,0.455);transition:transform .15s}
.item.open .chev{transform:rotate(90deg)}
.item-body{display:none;border-top:1px solid var(--border);padding:.75rem 1rem 1rem}
.item.open .item-body{display:block}
.item-tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem;font-size:.78rem}
.badge{display:inline-block;font-size:.68rem;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.b-red{background:rgba(224,112,95,0.18);color:var(--red)}
.b-amber{background:rgba(217,164,65,0.16);color:var(--amber)}
.b-teal{background:rgba(42,138,142,0.2);color:#8FC6C8}
.b-grey{background:rgba(16,68,78,0.084);color:rgba(16,68,78,0.65)}
.asset-group{margin-top:.5rem}
.asset-name{font-size:.78rem;font-weight:600;color:var(--teal-light);margin:.55rem 0 .2rem;display:flex;gap:.6rem;align-items:center}
.task{display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:center;padding:.3rem 0;border-bottom:1px solid rgba(16,68,78,0.056);font-size:.82rem}
.task .t-desc{color:rgba(16,68,78,0.92)}
.task .t-sub{font-size:.72rem;color:rgba(16,68,78,0.494)}
.mark{display:inline-flex;border:1px solid rgba(16,68,78,0.168);border-radius:5px;overflow:hidden}
.mark button{background:none;border:none;padding:.2rem .55rem;font-size:.75rem;cursor:pointer;color:rgba(16,68,78,0.585);min-width:34px}
.mark button.on-done{background:rgba(42,138,142,0.35);color:var(--white)}
.mark button.on-issue{background:rgba(224,112,95,0.3);color:var(--white)}
.mark button.on-na{background:rgba(155,142,196,0.25);color:var(--white)}
.task-note{grid-column:1/-1}
.task-note input{width:100%;font-size:.78rem;padding:.3rem .5rem}
.task.dup .t-desc::after{content:' · possible duplicate';color:var(--amber);font-size:.7rem}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--off-black)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{font-weight:500;font-size:.72rem;color:rgba(16,68,78,0.546);text-align:left;padding:.55rem .75rem;border-bottom:1px solid var(--border)}
td{padding:.55rem .75rem;border-bottom:1px solid rgba(16,68,78,0.07);vertical-align:top}
tr:last-child td{border-bottom:none}

.callbox{border:1px solid rgba(155,142,196,0.35);border-radius:var(--radius);padding:1rem 1.1rem;background:rgba(155,142,196,0.05)}
.callbox textarea{width:100%;min-height:80px;margin-top:.4rem}
.empty{border:1px dashed rgba(16,68,78,0.168);border-radius:var(--radius-lg);padding:3rem 1.5rem;text-align:center;color:rgba(16,68,78,0.585)}

/* ── CUSTOMER VIEW (paper) ── */
.paper{background:#FFFFFF;color:#1d2226;border-radius:10px;padding:2.5rem 2.75rem;max-width:860px;margin:0 auto;box-shadow:0 10px 40px rgba(16,68,78,0.122)}
.paper .p-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1A6B6B;padding-bottom:1rem;margin-bottom:1.5rem;gap:1rem}
.paper .p-brand{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:1rem;color:#1A6B6B}
.paper .p-brand small{display:block;font-weight:400;letter-spacing:.14em;font-size:.62rem;color:#6b6f73}
.paper h3{font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:600;text-transform:uppercase;line-height:1.15;color:#111110}
.paper .p-date{font-size:.8rem;color:#6b6f73;text-align:right}
.paper h4{font-family:'Oswald',sans-serif;font-size:.95rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#1A6B6B;margin:1.75rem 0 .6rem}
.paper .p-head{display:flex;gap:2rem;align-items:center;background:#F2F6F6;border-radius:8px;padding:1rem 1.25rem}
.paper .p-big{font-family:'Oswald',sans-serif;font-size:2.4rem;font-weight:600;color:#1A6B6B;line-height:1}
.paper .p-big-label{font-size:.82rem;color:#3d4348}
.paper .p-prop{display:grid;grid-template-columns:1fr 180px 50px;gap:1rem;align-items:center;padding:.55rem 0;border-bottom:1px solid #e6e9ea;font-size:.88rem}
.paper .p-prop .p-eq{grid-column:1/-1;font-size:.76rem;color:#6b6f73;margin-top:-.25rem}
.paper .p-bar{height:6px;border-radius:99px;background:#e3e8e9;overflow:hidden}
.paper .p-bar i{display:block;height:100%;background:#1A6B6B}
.paper .p-pct{text-align:right;font-weight:600}
.paper .tbl-wrap{background:#FFFFFF;border-color:#e3e8e9}
.paper table{font-size:.84rem}
.paper th{color:#6b6f73;border-bottom:1px solid #d9dedf}
.paper td{border-bottom:1px solid #eceff0;color:#1d2226}
.paper .p-attn{border-left:3px solid #C97A1E;background:#FBF4EA;padding:.7rem .9rem;border-radius:0 6px 6px 0;margin-bottom:.5rem;font-size:.86rem}
.paper .p-attn b{display:block;font-weight:600}
.paper .p-foot{margin-top:2rem;padding-top:1rem;border-top:1px solid #e6e9ea;font-size:.74rem;color:#6b6f73;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.paper .p-none{font-size:.86rem;color:#6b6f73}

.modal{display:none;position:fixed;inset:0;background:rgba(16,68,78,0.262);z-index:700;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal-box{background:var(--off-black);border:1px solid rgba(16,68,78,0.14);border-radius:var(--radius-lg);width:100%;max-width:560px;padding:1.5rem 1.75rem;max-height:90vh;overflow:auto}
.modal-box h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:1.05rem;margin-bottom:.4rem}
.modal-box p{font-size:.83rem;color:rgba(16,68,78,0.715);margin-bottom:.9rem}
.modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.1rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--charcoal);border:1px solid rgba(28,107,110,0.6);border-radius:8px;padding:.65rem 1rem;font-size:.83rem;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:760px){
  .qhead{grid-template-columns:1fr 1fr}
  .item-head{grid-template-columns:1fr 70px 20px}
  .item-head .hide-sm{display:none}
  .paper{padding:1.5rem 1.25rem}
  .paper .p-prop{grid-template-columns:1fr 90px 44px}
}
@media print{
  body{background:#fff}
  .tab-bar,.no-print,.toast,.modal{display:none!important}
  .wrap{padding:0;max-width:none}
  .paper{box-shadow:none;border-radius:0;padding:0;max-width:none}
}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="tab-bar">
  <div class="tab-logo-text">Alpine HVAC<small>Site Reports</small></div>
  <select class="sel" id="pick-customer" aria-label="Customer"></select>
  <select class="sel" id="pick-quarter" aria-label="Quarter"></select>
  <div class="seg" role="group" aria-label="View">
    <button id="view-internal" class="on" data-view="internal">Internal</button>
    <button id="view-customer" data-view="customer">Customer</button>
  </div>
  <span class="spacer"></span>
  <button class="bar-btn" id="btn-print">Print / PDF</button>
  <button class="bar-btn" id="btn-data">⇅ Data</button>
  <a class="bar-btn" href="dashboard.html">🏠 Dashboard</a>
</div>

<main class="wrap" id="main"><p class="muted">Loading…</p></main>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
  window.AP_SYNC_COLLECTION = "site_reports_data";
  window.AP_SYNC_ROUTES = { "st_": "site_data" };
  window.AP_APP_SCRIPT = "site-reports-app.js";
</script>
<script type="module" src="cloud-sync.js"></script>
</body>
</html>
