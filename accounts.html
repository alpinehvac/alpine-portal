<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — Account Management</title>
<script src="auth.js"></script>
<script>apGuard("accounts");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ALPINE ACCOUNT MANAGEMENT — one file per customer (accounts.html?c=<customer key>), or the customer list (accounts.html).
     Contains NO customer data: everything loads from Firestore after sign-in (owners only).
       account_data/ac_acct_<key>   contact, notes, report history + last-generated stamp (this page)
       site_data/st_site_<pid>      properties, assets, BuildOps visits (weekly BuildOps refresh)
       site_data/st_clear_<pid>_<q> CLEAR condition per asset (Site pages)
       service_agreements_data/sa_agr_<SA#>  agreements, tier, term, account manager
       ops_job_detail/{JO…}         tech summaries, recommendations, photos (daily job refresh)
       account_share/<token>        the customer-facing snapshot behind each live link (no dollar amounts)
     Quarterly run: ACCOUNT-REPORTS-QUARTERLY.md -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#27636C;--teal-light:#3D818A;--teal-dark:#10444E;--purple:#6C5D8D;--purple-light:#8A7BB0;
  --bg:#EAF2F3;--card:#FFFFFF;--soft:#E4F0F1;--ink:#10444E;--muted:#5A7A80;
  --red:#B83227;--amber:#A9821F;--green:#2E7D57;--border:rgba(16,68,78,0.12);--radius:8px;--radius-lg:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}
a{color:var(--teal-light)}
.wrap{max-width:1240px;margin:0 auto;padding:2rem 1.5rem 5rem}
.crumb{font-size:.82rem;color:var(--muted);margin-bottom:.35rem}
.crumb a{color:var(--teal);text-decoration:none}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;text-transform:uppercase;line-height:1.1}
h2{font-family:'Oswald',sans-serif;font-size:1.02rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:.6rem;margin:2rem 0 .75rem}
h2 .note{font-family:'Inter',sans-serif;font-size:.76rem;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.sub{color:var(--muted);margin-top:.35rem;font-size:.9rem}
.muted{color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:.5rem .9rem;cursor:pointer;border:1px solid rgba(16,68,78,0.25);background:var(--card);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-dark)}
.btn.sm{padding:.28rem .6rem;font-size:10px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:wait}
.sel,.inp{background:var(--card);border:1px solid rgba(16,68,78,0.2);border-radius:6px;padding:.45rem .65rem;font-size:.86rem}
.inp.wide{width:100%}
textarea.inp{width:100%;min-height:260px;line-height:1.5;resize:vertical;font-size:.86rem}
.badge{display:inline-block;font-size:.7rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.t-premium{background:rgba(108,93,141,0.16);color:#4E4268}.t-core{background:rgba(39,99,108,0.16);color:var(--teal)}
.t-base{background:rgba(46,125,87,0.14);color:var(--green)}.t-retail,.t-other{background:rgba(16,68,78,0.08);color:var(--muted)}
.b-red{background:rgba(184,50,39,0.12);color:var(--red)}.b-amber{background:rgba(169,130,31,0.15);color:#7A5C10}
.b-green{background:rgba(46,125,87,0.14);color:var(--green)}.b-grey{background:rgba(16,68,78,0.08);color:var(--muted)}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:1.4rem 0 1rem}
.spacer{flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)}
table.list{width:100%;border-collapse:collapse;font-size:.86rem}
table.list th{font-family:'Oswald',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.7rem .9rem;border-bottom:1px solid var(--border);white-space:nowrap}
table.list td{padding:.7rem .9rem;border-bottom:1px solid rgba(16,68,78,0.07);vertical-align:top}
table.list tr:last-child td{border-bottom:none}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:rgba(42,138,142,0.05)}
.cname{font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.stamp{font-size:.78rem}
.stamp.none{color:var(--muted)}
.stamp.stale{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-top:1.25rem}
.kpis>div{background:var(--card);padding:.85rem 1.05rem}
.kpis b{display:block;font-family:'Oswald',sans-serif;font-size:1.55rem;font-weight:600;line-height:1.2}
.kpis span{font-size:.75rem;color:var(--muted)}
.kpis small{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.panel{padding:1.1rem 1.2rem}
.panel h3{font-family:'Oswald',sans-serif;font-size:.86rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.65rem;font-size:.78rem;color:var(--muted)}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.75rem}
.prop{padding:.9rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.prop .pn{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;line-height:1.2}
.prop .pa{font-size:.78rem;color:var(--muted)}
.prop .pc{display:flex;gap:.35rem;flex-wrap:wrap;font-size:.74rem}
.prop .pl{display:flex;gap:.8rem;font-size:.78rem;margin-top:.2rem}
.prop.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.seg{display:inline-flex;border:1px solid rgba(16,68,78,0.21);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:none;padding:.42rem .9rem;font-size:.8rem;cursor:pointer;color:rgba(16,68,78,0.78)}
.seg button.on{background:var(--teal);color:#fff}
.bucket{overflow:hidden}
.job{padding:.85rem 1.1rem;border-bottom:1px solid rgba(16,68,78,0.07)}
.job:last-child{border-bottom:none}
.job-top{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;font-size:.8rem}
.job-top .jn{font-family:'Oswald',sans-serif;letter-spacing:.02em;text-decoration:none}
.job-title{font-weight:500;margin-top:.15rem}
.visits{list-style:none;margin-top:.4rem;display:flex;flex-direction:column;gap:.45rem;font-size:.8rem}
.visits li{display:grid;grid-template-columns:100px 1fr;gap:.6rem}
.visits .sm{color:var(--muted);font-size:.75rem}
.sumtxt{margin-top:.25rem;padding:.45rem .6rem;background:var(--soft);border-radius:6px;white-space:pre-wrap;font-size:.79rem}
.thumbs{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:5px;background:var(--soft)}
.empty{padding:1.1rem;color:var(--muted);font-size:.85rem}
.att{list-style:none;display:flex;flex-direction:column;gap:.45rem;font-size:.82rem}
.att li{display:flex;gap:.5rem;align-items:flex-start}
.rep-stamp{font-size:.82rem;border-radius:8px;padding:.6rem .75rem;margin-bottom:.75rem;background:var(--soft)}
.rep-stamp b{font-weight:600}
.rep-stamp.none{background:rgba(169,130,31,0.1);color:#6E5310}
.linkrow{display:flex;gap:.4rem;align-items:center;margin:.5rem 0}
.linkrow input{flex:1;min-width:0;font-size:.76rem}
.hist{list-style:none;font-size:.8rem;display:flex;flex-direction:column;gap:.3rem;margin-top:.4rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--teal-dark);color:#fff;border-radius:8px;padding:.65rem 1rem;font-size:.84rem;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{border-radius:var(--radius);padding:.7rem 1rem;font-size:.85rem;margin-bottom:1rem;background:rgba(42,138,142,0.1);border:1px solid rgba(42,138,142,0.35);color:var(--teal)}
.src{display:inline-block;font-size:.66rem;font-weight:600;border-radius:99px;padding:0 7px;margin-left:4px;background:rgba(108,93,141,0.14);color:#4E4268;vertical-align:middle}
.src.man{background:rgba(46,125,87,0.14);color:var(--green)}
.cands{list-style:none;display:flex;flex-direction:column;gap:.5rem;font-size:.8rem}
.cands li{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start;border-top:1px solid var(--border);padding-top:.5rem}
.cands .srcs{font-size:.7rem;color:var(--purple)}
.cust h3{margin:1.1rem 0 .5rem}
.cust-bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--card);padding:.25rem 0 .6rem;z-index:5;border-bottom:1px solid var(--border)}
.chk{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:.32rem .65rem;margin:0 .35rem .35rem 0}
.chk input,.cu-jh input,.cu-visit input{width:16px;height:16px;accent-color:var(--teal)}
.cu-att .chk{display:flex}
.cu-site{font-family:'Oswald',sans-serif;font-size:.95rem;margin:1rem 0 .4rem}
.cu-job{border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem;margin-bottom:.5rem}
.cu-job.off{opacity:.45}
.cu-jh{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;font-size:.84rem;cursor:pointer}
.cu-visit{margin:.45rem 0 0 1.6rem;font-size:.8rem}
.cu-visit label{display:flex;gap:.4rem;align-items:flex-start;cursor:pointer}
.cu-visit.off label{opacity:.5;text-decoration:line-through}
.cu-ph{display:flex;gap:.35rem;flex-wrap:wrap;margin:.35rem 0 0 1.4rem}
.cu-ph button{border:2px solid transparent;border-radius:7px;padding:0;background:none;cursor:pointer;opacity:.35;position:relative}
.cu-ph button.on{border-color:var(--teal);opacity:1}
.cu-ph button.on::after{content:'✓';position:absolute;top:2px;right:4px;color:#fff;font-size:.7rem;font-weight:700;text-shadow:0 0 3px #000}
.cu-ph img{width:72px;height:72px;object-fit:cover;border-radius:5px;display:block}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.visits li{grid-template-columns:1fr}.hide-sm{display:none}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>
<div class="toast" id="toast" role="status"></div>
<script>
  window.AP_SYNC_COLLECTION = "account_data";
  window.AP_SYNC_ROUTES = { "st_": "site_data", "sa_": "service_agreements_data" };
  window.AP_APP_SCRIPT = "accounts-app.js";
</script>
<script type="module" src="cloud-sync.js"></script>
</body>
</html>
