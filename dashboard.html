<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Alpine HVAC Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1C6B6E;--teal-light:#2A8A8E;--teal-dark:#0F4547;
  --black:#111110;--off-black:#1A1A18;--charcoal:#2A2A28;--mid:#3A3A37;
  --grey:#6B6B67;--light-grey:#9A9A95;--white:#FFFFFF;
  --border:rgba(255,255,255,0.08);--border-med:rgba(255,255,255,0.14);
}
html,body{min-height:100vh}
body{font-family:'Inter',system-ui,sans-serif;background:var(--black);color:var(--white);font-size:15px;line-height:1.6}

nav{background:var(--off-black);border-bottom:1px solid rgba(28,107,110,0.3);position:sticky;top:0;z-index:50}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-icon{width:32px;height:32px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-wordmark{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--white);line-height:1}
.nav-wordmark small{display:block;font-size:8px;font-weight:400;letter-spacing:.18em;color:var(--teal-light);margin-top:2px}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-user{font-size:12px;color:var(--light-grey)}
.nav-user strong{color:var(--white);font-weight:500}
.btn-logout{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--border-med);color:var(--light-grey);padding:6px 14px;border-radius:6px;cursor:pointer;transition:all .2s}
.btn-logout:hover{border-color:rgba(255,255,255,0.35);color:var(--white)}

main{max-width:1100px;margin:0 auto;padding:3rem 2rem}
.welcome{margin-bottom:2.5rem}
.welcome h1{font-family:'Oswald',sans-serif;font-size:2rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.35rem}
.welcome p{font-size:14px;color:var(--light-grey)}

.section-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--light-grey);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}

.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:3rem}
.tool-card{background:var(--off-black);border:1px solid var(--border);border-radius:12px;padding:1.5rem;text-decoration:none;color:var(--white);transition:border-color .2s,transform .15s;display:flex;flex-direction:column;gap:12px}
.tool-card:hover{border-color:rgba(28,107,110,0.6);transform:translateY(-2px)}
.tool-card.locked{opacity:0.3;pointer-events:none}
.tool-card-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.tool-card-icon svg{width:22px;height:22px;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tool-card-name{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tool-card-desc{font-size:12px;color:var(--light-grey);line-height:1.55;flex:1}
.tool-card-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:4px;margin-top:4px;width:fit-content}

.ic-teal{background:rgba(28,107,110,0.2)}.ic-teal svg{stroke:#2A8A8E}
.ic-purple{background:rgba(155,142,196,0.15)}.ic-purple svg{stroke:#B8AEDC}
.ic-amber{background:rgba(239,159,39,0.15)}.ic-amber svg{stroke:#EF9F27}
.ic-blue{background:rgba(55,138,221,0.15)}.ic-blue svg{stroke:#378ADD}
.ic-coral{background:rgba(216,90,48,0.15)}.ic-coral svg{stroke:#F0997B}

.badge-teal{background:rgba(28,107,110,0.25);color:#2A8A8E}
.badge-purple{background:rgba(155,142,196,0.2);color:#B8AEDC}
.badge-amber{background:rgba(239,159,39,0.2);color:#EF9F27}
.badge-blue{background:rgba(55,138,221,0.15);color:#378ADD}
.badge-coral{background:rgba(216,90,48,0.2);color:#F0997B}
.badge-grey{background:rgba(255,255,255,0.08);color:var(--light-grey)}

/* admin table */
.admin-panel{background:var(--off-black);border:1px solid rgba(28,107,110,0.25);border-radius:12px;padding:1.5rem;margin-bottom:3rem}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:1rem}
.admin-table th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--light-grey);padding:.5rem .75rem;border-bottom:1px solid var(--border)}
.admin-table td{padding:.6rem .75rem;border-bottom:1px solid var(--border);color:rgba(255,255,255,0.75);vertical-align:middle}
.admin-table tr:last-child td{border-bottom:none}
.role-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.rb-admin{background:rgba(28,107,110,0.25);color:#2A8A8E}
.rb-sales_ops{background:rgba(239,159,39,0.2);color:#EF9F27}
.rb-ops{background:rgba(55,138,221,0.15);color:#378ADD}
.rb-sales{background:rgba(155,142,196,0.2);color:#B8AEDC}

@media(max-width:640px){main{padding:2rem 1rem}.tool-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="dashboard.html">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div class="nav-wordmark">Alpine HVAC<small>Internal Portal</small></div>
    </a>
    <div class="nav-right">
      <span class="nav-user">Signed in as <strong id="navName"></strong></span>
      <button class="btn-logout" onclick="apLogout()">Sign Out</button>
    </div>
  </div>
</nav>

<main>
  <div class="welcome">
    <h1 id="welcomeHeading">Welcome back</h1>
    <p id="welcomeSub"></p>
  </div>

  <div class="section-label">Tools &amp; Modules</div>
  <div class="tool-grid" id="toolGrid"></div>

  <div id="adminSection" style="display:none">
    <div class="section-label">Team — User Management</div>
    <div class="admin-panel" id="adminPanel"></div>
  </div>
</main>

<script src="auth.js"></script>
<script>
const PAGES = [
  {
    id: "tech-recruiting",
    name: "Tech Recruiting",
    desc: "Technician job postings, applications, and candidate tracking.",
    file: "tech-recruiting.html",
    ic: "ic-teal", badge: "badge-teal", badgeText: "Recruiting",
    icon: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`
  },
  {
    id: "bdr-recruiting",
    name: "BDR Recruiting",
    desc: "Business development rep pipeline, interview stages, and evaluations.",
    file: "bdr-recruiting.html",
    ic: "ic-purple", badge: "badge-purple", badgeText: "Recruiting",
    icon: `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>`
  },
  {
    id: "bdr-interview-prep",
    name: "BDR Interview Prep",
    desc: "Interview preparation guide for BDR candidates — stage 2.",
    file: "bdr-interview-prep.docx",
    ic: "ic-coral", badge: "badge-coral", badgeText: "Recruiting",
    icon: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`
  },
  {
    id: "tech-reviews",
    name: "Tech Reviews",
    desc: "Performance reviews and evaluation forms for field technicians.",
    file: "tech-reviews.html",
    ic: "ic-blue", badge: "badge-blue", badgeText: "Reviews",
    icon: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>`
  },
  {
    id: "pl-calculator",
    name: "P&L / Comp Calculator",
    desc: "Profit & loss tracking and compensation calculations.",
    file: "pl-calculator.html",
    ic: "ic-amber", badge: "badge-amber", badgeText: "Finance",
    icon: `<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>`
  }
];

const session = apGetSession();
if (!session) { window.location.href = "index.html"; }

document.getElementById("navName").textContent = session.name;
document.getElementById("welcomeHeading").textContent = "Welcome back, " + session.name.split(" ")[0] + ".";
const roleLabel = { admin:"Full admin access", sales_ops:"Sales & operations access", ops:"Operations access", sales:"Sales access" };
document.getElementById("welcomeSub").textContent = roleLabel[session.role] || "Team member";

const grid = document.getElementById("toolGrid");
PAGES.forEach(p => {
  const can = apCanAccess(p.id, session);
  const card = document.createElement("a");
  card.className = "tool-card" + (can ? "" : " locked");
  card.href = can ? p.file : "#";
  if (p.file.endsWith(".docx")) card.target = "_blank";
  card.innerHTML = `
    <div class="tool-card-icon ${p.ic}">${p.icon}</div>
    <div>
      <div class="tool-card-name">${p.name}</div>
      <div class="tool-card-desc">${p.desc}</div>
      <span class="tool-card-badge ${p.badge}">${p.badgeText}</span>
    </div>`;
  grid.appendChild(card);
});

if (session.role === "admin") {
  document.getElementById("adminSection").style.display = "block";
  const rc = { admin:"rb-admin", sales_ops:"rb-sales_ops", ops:"rb-ops", sales:"rb-sales" };
  const rows = Object.entries(USERS).map(([u, d]) =>
    `<tr>
      <td style="font-family:monospace;font-size:12px;color:rgba(255,255,255,0.6)">${u}</td>
      <td style="font-weight:500">${d.name}</td>
      <td style="color:var(--light-grey);font-size:12px">${d.email}</td>
      <td><span class="role-badge ${rc[d.role]||''}">${d.role}</span></td>
      <td style="font-family:monospace;font-size:11px;color:var(--grey)">${d.password}</td>
    </tr>`
  ).join("");
  document.getElementById("adminPanel").innerHTML = `
    <table class="admin-table">
      <thead><tr><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th>Password</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="font-size:11px;color:var(--grey);margin-top:1rem;">Edit credentials in <code style="font-size:11px;color:#2A8A8E">auth.js</code></p>`;
}
</script>
</body>
</html>
