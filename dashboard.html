<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — Internal Portal</title>
<script src="auth.js"></script>
<script>
const __session = apGetSession();
if (!__session) window.location.href = "index.html";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#27636C;--teal-light:#3D818A;--teal-dark:#10444E;
  --black:#EAF2F3;--off-black:#FFFFFF;--charcoal:#E4F0F1;
  --grey:#5A7A80;--light-grey:#5A7A80;--white:#10444E;
  --border:rgba(16,68,78,0.12);--radius:8px;--radius-lg:14px;
}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--black);color:var(--white);min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--off-black)}
::-webkit-scrollbar-thumb{background:var(--teal);color:#FFFFFF}

nav{position:sticky;top:0;z-index:100;background:var(--black);border-bottom:1px solid rgba(28,107,110,0.35)}
.nav-inner{max-width:1040px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#FFFFFF}
.logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-wordmark{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--white);line-height:1}
.nav-wordmark small{display:block;font-size:9px;font-weight:400;letter-spacing:.18em;color:var(--teal-light);margin-top:2px}
.nav-right{display:flex;align-items:center;gap:1.5rem}
.nav-user{font-size:12px;color:var(--light-grey)}
.nav-user b{color:var(--white);font-weight:600}
.logout-btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(16,68,78,0.65);background:none;border:1px solid rgba(16,68,78,0.21);border-radius:6px;padding:8px 16px;cursor:pointer;transition:all .2s}
.logout-btn:hover{color:var(--white);border-color:rgba(16,68,78,0.455)}

.wrap{max-width:1040px;margin:0 auto;padding:3.5rem 2rem 5rem}
.eyebrow{font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-light);margin-bottom:.75rem;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--teal);flex-shrink:0;color:#FFFFFF}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700;text-transform:uppercase;line-height:1.1;margin-bottom:.5rem}
.sub{font-size:.9375rem;color:rgba(16,68,78,0.65);margin-bottom:3rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem}
.card{background:var(--off-black);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;text-decoration:none;color:var(--white);transition:border-color .2s,transform .2s;display:flex;flex-direction:column;gap:.75rem}
.card:hover{border-color:rgba(28,107,110,0.5);transform:translateY(-2px)}
.card-icon{width:40px;height:40px;background:rgba(28,107,110,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--teal-light)}
.card-title{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.card-desc{font-size:.8125rem;color:rgba(16,68,78,0.585);line-height:1.6}

.empty{background:var(--off-black);border:1px dashed rgba(16,68,78,0.14);border-radius:var(--radius-lg);padding:4rem 2rem;text-align:center;color:rgba(16,68,78,0.455);font-size:.9rem}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
.cat-card{background:var(--off-black);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.25rem 1.75rem;text-decoration:none;color:var(--white);transition:border-color .2s,transform .2s;display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;cursor:pointer}
.cat-card:hover{border-color:rgba(28,107,110,0.5);transform:translateY(-2px)}
.cat-icon{width:48px;height:48px;background:rgba(28,107,110,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--teal-light)}
.cat-title{font-family:'Oswald',sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.cat-desc{font-size:.825rem;color:rgba(16,68,78,0.585);line-height:1.6}
.back-link{display:inline-flex;align-items:center;gap:6px;font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-light);text-decoration:none;margin-bottom:1.5rem}
.back-link:hover{color:var(--white)}

.agr-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.5rem}
.agr-kpi{background:var(--off-black);padding:1rem 1.2rem}
.agr-kpi b{display:block;font-family:'Oswald',sans-serif;font-size:1.7rem;font-weight:600;line-height:1.2}
.agr-kpi span{font-size:.76rem;color:rgba(16,68,78,0.585)}
.agr-kpi.alert b{color:#B83227}
.agr-list{border:1px solid var(--border);border-radius:var(--radius);background:var(--off-black);overflow:hidden;margin-bottom:1.5rem}
.agr-row{display:grid;grid-template-columns:90px 1fr 140px 150px;gap:1rem;align-items:center;padding:.75rem 1.1rem;border-bottom:1px solid rgba(16,68,78,0.07);text-decoration:none;color:var(--white);font-size:.88rem}
.agr-row:last-child{border-bottom:none}
.agr-row:hover{background:rgba(28,107,110,0.08)}
.agr-row .id{font-family:'Oswald',sans-serif;color:var(--teal-light)}
.agr-row .muted{color:rgba(16,68,78,0.546);font-size:.8rem}
.agr-badge{justify-self:start;font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.agr-badge.od{background:rgba(224,112,95,0.18);color:#B83227}
.agr-badge.d30{background:rgba(224,112,95,0.12);color:#C0503F}
.agr-badge.d60{background:rgba(217,164,65,0.15);color:#A9821F}
.agr-badge.d90{background:rgba(155,142,196,0.16);color:#6C5D8D}
.agr-badge.q{background:rgba(217,164,65,0.15);color:#A9821F}
.agr-h{font-family:'Oswald',sans-serif;font-size:.95rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0 0 .6rem}
.agr-empty{padding:1.25rem;color:rgba(16,68,78,0.585);font-size:.86rem}
.agr-open{display:inline-block;margin-top:.25rem}
@media (max-width:700px){.agr-kpis{grid-template-columns:1fr 1fr}.agr-row{grid-template-columns:70px 1fr;}.agr-row .hide-sm{display:none}}
.renew-strip{display:none;align-items:center;gap:1.25rem;flex-wrap:wrap;background:var(--off-black);border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:var(--radius);padding:.9rem 1.25rem;margin-bottom:2rem;text-decoration:none;color:var(--white);font-size:.85rem}
.renew-strip.alert{border-left-color:#B83227}
.renew-strip:hover{border-color:rgba(28,107,110,0.5)}
.renew-strip b{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;margin-right:4px}
.renew-strip .rs-title{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-light)}
.renew-strip .rs-od b{color:#B83227}
.renew-strip .rs-go{margin-left:auto;font-size:.78rem;color:rgba(16,68,78,0.585)}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="nav-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div class="nav-wordmark">Alpine HVAC<small>Internal Portal</small></div>
    </div>
    <div class="nav-right">
      <span class="nav-user">Signed in as <b id="nav-user-name"></b></span>
      <button class="logout-btn" onclick="apLogout()">Sign Out</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="eyebrow" id="page-eyebrow">Dashboard</div>
  <div id="back-link-wrap"></div>
  <h1 id="page-h1">Your Tools</h1>
  <p class="sub" id="page-sub">Select a tool below. You'll only see what's relevant to your role.</p>
  <div id="agr-panel" style="display:none"></div>
  <div class="cat-grid" id="cat-grid" style="display:none"></div>
  <div class="grid" id="tool-grid"></div>
</div>

<script>
const TOOL_META = {
  "cash-dashboard":    { icon: "💵", desc: "Cash and profit position: 13-week forecast, billed vs earned profit, break-even targets." },
  "job-profit":        { icon: "🔧", desc: "Profit by job: percent complete, earned vs billed, and quoted vs actual with labour and materials breakdowns." },
  "ops-dashboard":     { icon: "🚐", desc: "Field operations: jobs in progress, upcoming and completed, dispatch board, PMs due, and what needs a look." },
  "agreements":        { label: "Agreements", icon: "📑", desc: "Renewals due or overdue, and open agreement quotes.", href: "dashboard.html?cat=agreements" },
  "pl-calculator":     { icon: "📊", desc: "Model P&L outcomes and compensation scenarios." },
  "team-hub":          { icon: "🧭", desc: "Recruiting, onboarding, and team management in one place." },
  "service-agreement": { icon: "🧮", desc: "Calculate man-hours and pricing for service agreements." },
  "service-agreements":{ icon: "📑", desc: "Active agreements, renewal pipeline, and win-back outreach to past customers." },
  "site-reports":      { icon: "🗂️", desc: "Quarterly maintenance checklists and customer service summaries." },
  "sales-strategy":    { icon: "🎯", desc: "A living playbook for uncovering value and closing sales." },
  "case-studies":      { icon: "📖", desc: "Real customer wins to reference during sales conversations." },
  "lead-sheets":       { icon: "📋", desc: "Track and manage inbound sales leads.", external: "https://netorg13787440-my.sharepoint.com/:x:/g/personal/natalie_townsend_alpinehvac_ca/IQDFyXX0JO36RaKmRK5rUj8TATpMgjfqE_WIuufYkn7YIIw?e=cX7qOq" },
  "call-log":          { icon: "📞", desc: "Log on-call coverage and incoming customer calls.", external: "https://docs.google.com/spreadsheets/d/1IaDmMURNjVWhIQZ0eVhDRFjUFVhevVXNHTJ0-BW3ZvM/edit?usp=sharing" },
};

// Owner "tool belt" categories. Adjust freely as tools are added/moved —
// a tool can appear in more than one category if it's relevant to both.
const TOOL_CATEGORIES = {
  sales:      { label: "Sales",      icon: "💼", desc: "Estimating, quoting, and customer-facing tools.", tools: ["service-agreement", "service-agreements", "site-reports", "sales-strategy", "case-studies", "lead-sheets"] },
  operations: { label: "Operations", icon: "🛠️", desc: "Field operations, agreements, scheduling, and day-to-day ops tools.", tools: ["ops-dashboard", "agreements", "site-reports", "team-hub", "call-log"] },
  financials: { label: "Financials", icon: "📊", desc: "P&L, compensation, and financial reporting.",       tools: ["cash-dashboard", "job-profit", "pl-calculator"] },
};
// "agreements" is a pseudo-tool: the renewal-alerts view (dashboard.html?cat=agreements),
// listed under Operations. Visible only to people with Service Agreement Tracker access.
const canSeeAgreements = () => apHasAccess(session, "service-agreements");

const session = apGetSession();
document.getElementById("nav-user-name").textContent = session.name;

const isOwner = session.roles.includes("super_admin");
const isPureSales = session.roles.includes("sales") && !isOwner;

const catGrid = document.getElementById("cat-grid");
const toolGrid = document.getElementById("tool-grid");
const eyebrow = document.getElementById("page-eyebrow");
const h1 = document.getElementById("page-h1");
const sub = document.getElementById("page-sub");
const backWrap = document.getElementById("back-link-wrap");

const params = new URLSearchParams(window.location.search);
const cat = params.get("cat");

function renderToolGrid(toolIds, emptyMsg) {
  catGrid.style.display = "none";
  toolGrid.style.display = "";
  if (toolIds.length === 0) {
    toolGrid.outerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }
  toolGrid.innerHTML = "";
  toolIds.forEach(id => {
    const meta = TOOL_META[id] || {};
    const label = meta.label || (typeof AP_TOOLS !== "undefined" && AP_TOOLS[id] && AP_TOOLS[id].label) || id;
    const a = document.createElement("a");
    a.className = "card";
    if (meta.external) {
      a.href = meta.external;
      a.target = "_blank";
      a.rel = "noopener";
    } else {
      a.href = meta.href || (id + ".html");
    }
    a.innerHTML = `
      <div class="card-icon">${meta.icon || "🔧"}</div>
      <div class="card-title">${label}</div>
      <div class="card-desc">${meta.desc || ""}</div>
    `;
    toolGrid.appendChild(a);
  });
}

function renderCategoryGrid() {
  toolGrid.style.display = "none";
  catGrid.style.display = "";
  catGrid.innerHTML = "";
  Object.keys(TOOL_CATEGORIES).forEach(key => {
    const c = TOOL_CATEGORIES[key];
    const a = document.createElement("a");
    a.className = "cat-card";
    a.href = "dashboard.html?cat=" + key;
    a.innerHTML = `
      <div class="cat-icon">${c.icon}</div>
      <div class="cat-title">${c.label}</div>
      <div class="cat-desc">${c.desc}</div>
    `;
    catGrid.appendChild(a);
  });
}

const visible = apVisibleTools().concat(canSeeAgreements() ? ["agreements"] : []);

if (cat === "agreements" && canSeeAgreements()) {
  eyebrow.textContent = isOwner ? "Dashboard · Operations · Agreements" : "Dashboard · Agreements";
  h1.textContent = "Agreements";
  sub.textContent = "Renewals that need attention and open quotes. Click any agreement to open it.";
  backWrap.innerHTML = isOwner ? '<a class="back-link" href="dashboard.html?cat=operations">&larr; Operations</a>' : '<a class="back-link" href="dashboard.html">&larr; Your Tools</a>';
  catGrid.style.display = "none";
  toolGrid.style.display = "none";
  document.getElementById("agr-panel").style.display = "";
  document.getElementById("agr-panel").innerHTML = '<p class="agr-empty">Loading agreements…</p>';
  window.addEventListener("ap-cloud-ready", renderAgreementsTab);
  window.AP_SYNC_COLLECTION = "service_agreements_data";
  const cs = document.createElement("script");
  cs.type = "module"; cs.src = "cloud-sync.js";
  document.body.appendChild(cs);
} else if (isPureSales) {
  // Sales team members skip the category picker entirely and land straight
  // on their tools.
  eyebrow.textContent = "Dashboard";
  h1.textContent = "Your Tools";
  sub.textContent = "Select a tool below.";
  renderToolGrid(visible.includes("agreements") ? ["agreements", ...visible.filter(id => id !== "agreements")] : visible, "No tools are assigned to your account yet. Contact your administrator.");
} else if (isOwner && !cat) {
  // Owners land on the 3-category homepage first.
  eyebrow.textContent = "Dashboard";
  h1.textContent = "Your Tool Belts";
  sub.textContent = "Choose a category to see the tools inside it.";
  renderCategoryGrid();
} else if (isOwner && cat && TOOL_CATEGORIES[cat]) {
  const c = TOOL_CATEGORIES[cat];
  eyebrow.textContent = "Dashboard · " + c.label;
  h1.textContent = c.label + " Tools";
  sub.textContent = c.desc;
  backWrap.innerHTML = '<a class="back-link" href="dashboard.html">&larr; All Categories</a>';
  const catTools = c.tools.filter(id => visible.includes(id));
  renderToolGrid(catTools, "No tools in this category are assigned to your account yet.");
} else {
  // Support, ops, or anyone else not covered above: flat list, unchanged.
  eyebrow.textContent = "Dashboard";
  h1.textContent = "Your Tools";
  sub.textContent = "Select a tool below. You'll only see what's relevant to your role.";
  renderToolGrid(visible, "No tools are assigned to your account yet. Contact your administrator.");
}

// ── Agreements tab: renewal alerts (replaces the old banner) ──
function renderAgreementsTab() {
  const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pd = s => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const ruleEnd = s => { const d = pd(s); return d ? new Date(d.getFullYear() + 1, d.getMonth(), d.getDate() - 1) : null; };
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmt = d => d ? M[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear() : "—";
  const money = n => n ? "$" + Number(n).toLocaleString("en-CA", { maximumFractionDigits: 0 }) : "—";
  const t = new Date(); const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const due = [], quotes = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k.startsWith("sa_agr_")) continue;
    let a; try { a = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
    if (!a || a.deleted) continue;
    if (a.status === "Draft") { const q = pd(a.draftDate); quotes.push({ a, days: q ? Math.round((today - q) / 86400000) : null }); continue; }
    if (a.status !== "Active") continue;
    const end = pd(a.endDate) || ruleEnd(a.startDate);
    if (!end) continue;
    const days = Math.round((end - today) / 86400000);
    if (days <= 90 || (a.renewalStage && a.renewalStage !== "Not Started")) due.push({ a, end, days });
  }
  due.sort((x, y) => x.days - y.days);
  quotes.sort((x, y) => (y.days || 0) - (x.days || 0));
  const od = due.filter(x => x.days < 0), d30 = due.filter(x => x.days >= 0 && x.days <= 30), d90 = due.filter(x => x.days > 30 && x.days <= 90);
  const acv = list => money(list.reduce((s, x) => s + (Number(x.a.acv) || 0), 0));
  const badge = d => d < 0 ? '<span class="agr-badge od">Overdue ' + (-d) + 'd</span>' : d <= 30 ? '<span class="agr-badge d30">' + d + ' days</span>' : d <= 60 ? '<span class="agr-badge d60">' + d + ' days</span>' : '<span class="agr-badge d90">' + d + ' days</span>';
  let h = '<div class="agr-kpis">' +
    '<div class="agr-kpi' + (od.length ? ' alert' : '') + '"><b>' + od.length + '</b><span>overdue · ' + acv(od) + ' ACV</span></div>' +
    '<div class="agr-kpi"><b>' + d30.length + '</b><span>within 30 days · ' + acv(d30) + '</span></div>' +
    '<div class="agr-kpi"><b>' + d90.length + '</b><span>within 31–90 days · ' + acv(d90) + '</span></div>' +
    '<div class="agr-kpi"><b>' + quotes.length + '</b><span>open quotes</span></div></div>';
  h += '<div class="agr-h">Renewals needing attention</div><div class="agr-list">' + (due.length ? due.map(x =>
    '<a class="agr-row" href="agreement.html?id=' + encodeURIComponent(x.a.id) + '"><span class="id">' + esc(x.a.id) + '</span>' +
    '<span>' + esc(x.a.name) + '<br><span class="muted">' + esc(String(x.a.customer || "").replace(/^\*+/, "")) + (x.a.renewalStage && x.a.renewalStage !== "Not Started" ? " · " + esc(x.a.renewalStage) : "") + (x.a.renewalOwner ? " · " + esc(x.a.renewalOwner) : "") + '</span></span>' +
    '<span class="muted hide-sm">Ends ' + fmt(x.end) + '<br>' + money(x.a.acv) + ' ACV</span>' + badge(x.days) + '</a>').join("") : '<p class="agr-empty">Nothing due in the next 90 days.</p>') + '</div>';
  h += '<div class="agr-h">Open quotes</div><div class="agr-list">' + (quotes.length ? quotes.map(x =>
    '<a class="agr-row" href="agreement.html?id=' + encodeURIComponent(x.a.id) + '"><span class="id">' + esc(x.a.id) + '</span><span>' + esc(x.a.name) + '</span>' +
    '<span class="muted hide-sm">' + (x.days != null ? x.days + ' days open' : '') + '</span><span class="agr-badge q">Quote</span></a>').join("") : '<p class="agr-empty">No open quotes.</p>') + '</div>';
  h += '<a class="back-link agr-open" href="service-agreements.html">Open the full agreement tracker &rarr;</a>';
  document.getElementById("agr-panel").innerHTML = h;
}
</script>
</body>
</html>
