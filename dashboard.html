<script>
// ── Routing ──────────────────────────────────────────────────────────
// dashboard.html                 → the signed-in person's start page (AP_START in auth.js)
// dashboard.html?view=home       → owner overview (owners) or "Your Tools" (everyone else)
// dashboard.html?view=sales|operations|financials → section dashboards
// dashboard.html?cat=…           → old links: mapped to the new views
(function () {
  const s = apGetSession();
  if (!s) { try { sessionStorage.setItem("ap_redirect", "dashboard.html" + location.search); } catch (e) {} location.replace("index.html"); return; }
  const p = new URLSearchParams(location.search);
  const cat = p.get("cat");
  if (cat === "agreements") { location.replace("service-agreements.html"); return; }
  if (cat) { location.replace("dashboard.html?view=" + encodeURIComponent(cat)); return; }
  if (!p.get("view")) { location.replace(apStartPage(s)); return; }
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#27636C;--teal-light:#3D818A;--teal-dark:#10444E;--ink:#10444E;--muted:#5A7A80;
  --card:#FFFFFF;--border:rgba(16,68,78,0.12);--red:#B83227;--amber:#A9821F;--green:#2E7D57;
  --radius:10px;--radius-lg:14px;
}
html,body{min-height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding:1.75rem 2rem 4rem}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.eyebrow{font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-light);margin-bottom:.35rem;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--teal)}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.6rem,3vw,2.1rem);font-weight:700;text-transform:uppercase;line-height:1.1}
.date{font-size:.85rem;color:var(--muted)}
h2{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0}
.sec{margin:0 0 1.6rem}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:0 0 .65rem}
.sec-h a{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);text-decoration:none}
.sec-h a:hover{color:var(--teal-dark)}
.note{font-size:.78rem;color:var(--muted);line-height:1.45}
iframe.emb{display:block;width:100%;border:0;min-height:120px;background:transparent}
.loading{font-size:.85rem;color:var(--muted);padding:1rem 0}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(16,68,78,.06);min-width:0}
.kpi .l{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:'Oswald',sans-serif;font-size:1.65rem;font-weight:600;line-height:1.2;margin:.2rem 0 .1rem}
.kpi .s{font-size:.78rem;color:var(--muted);line-height:1.35}
.kpi.red .v{color:var(--red)}.kpi.amber .v{color:var(--amber)}.kpi.green .v{color:var(--green)}
.kpi.hero{border-left:4px solid var(--teal)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(16,68,78,.06)}
.panel h3{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0 0 .55rem}
.list{list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:.5rem 0;border-bottom:1px solid rgba(16,68,78,.07);font-size:.86rem}
.list li:last-child{border-bottom:0}
.list a{color:var(--ink);text-decoration:none}.list a:hover{color:var(--teal)}
.list .grow{flex:1;min-width:0}
.list small{display:block;color:var(--muted);font-size:.75rem}
.badge{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.badge.red{background:rgba(224,112,95,.18);color:var(--red)}
.badge.amber{background:rgba(217,164,65,.17);color:var(--amber)}
.badge.teal{background:rgba(61,129,138,.14);color:var(--teal)}
.empty{font-size:.85rem;color:var(--muted);padding:.4rem 0}

/* touch log */
.tl-form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) auto;gap:8px;align-items:end;margin:.4rem 0 .8rem}
.tl-form label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.tl-form input,.tl-form select{font:500 14px 'Inter',sans-serif;color:var(--ink);border:1px solid rgba(16,68,78,.2);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;padding:10px 14px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
table.tl{width:100%;border-collapse:collapse;font-size:.82rem}
table.tl th{text-align:right;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:.35rem .5rem;border-bottom:1px solid var(--border)}
table.tl th:first-child,table.tl td:first-child{text-align:left}
table.tl td{text-align:right;padding:.4rem .5rem;border-bottom:1px solid rgba(16,68,78,.06)}
details.upd{margin-top:1.5rem}
details.upd summary{cursor:pointer;font-size:.8rem;color:var(--muted)}
details.upd textarea{width:100%;margin:.6rem 0;font:12px ui-monospace,monospace;border:1px solid rgba(16,68,78,.2);border-radius:8px;padding:8px}

/* tools grid (Home for people without an overview) */
.tgroup{margin-bottom:1.8rem}
.tgroup h2{margin-bottom:.7rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem 1.3rem;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:.45rem;transition:border-color .2s,transform .2s}
.tcard:hover{border-color:rgba(28,107,110,.5);transform:translateY(-2px)}
.tcard .ti{font-size:20px}
.tcard .tt{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.tcard .td{font-size:.8rem;color:rgba(16,68,78,.6);line-height:1.5}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:900px){.wrap{padding:4rem 1rem 3rem}}
@media (max-width:640px){.tl-form{grid-template-columns:1fr 1fr}}
</style>

<script>
// ── Shared helpers ───────────────────────────────────────────────────
const session = apGetSession() || { name: "", roles: [], email: "" };
const VIEW = new URLSearchParams(location.search).get("view") || "home";
const can = id => apHasAccess(session, id);
const has = r => session.roles.includes(r);
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => n == null || isNaN(n) ? "—" : (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-CA");
const moneyK = n => n == null || isNaN(n) ? "—" : (n < 0 ? "−$" : "$") + (Math.abs(n) >= 1e6 ? (Math.abs(n) / 1e6).toFixed(2) + "M" : Math.abs(n) >= 1e4 ? Math.round(Math.abs(n) / 1000) + "K" : (Math.abs(n) / 1000).toFixed(1) + "K");
const pd = s => { if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const T = (() => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); })();
const fmtD = d => d ? d.toLocaleDateString("en-CA", { month: "short", day: "numeric", year: d.getFullYear() !== T.getFullYear() ? "numeric" : undefined }) : "—";
const monday = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const kpi = (cls, l, v, s) => `<div class="kpi ${cls || ""}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s || ""}</div></div>`;
const frame = (src, title) => `<iframe class="emb" src="${src}" title="${esc(title)}"></iframe>`;

// Embedded blocks report their height; fit each frame to its content.
window.addEventListener("message", e => {

  document.querySelectorAll("iframe.emb").forEach(f => { if (f.contentWindow === e.source) f.style.height = e.data.height + "px"; });
});

// Tool descriptions for the "Your Tools" home (people without an overview dashboard).

  "site-reports":      { icon: "🗂️", desc: "Quarterly maintenance checklists and customer service summaries." },
  "sales-strategy":    { icon: "🎯", desc: "A living playbook for uncovering value and closing sales." },
  "case-studies":      { icon: "📖", desc: "Real customer wins to reference during sales conversations." },
  "audit-tool":        { icon: "📋", desc: "Run a Building Performance Audit: asset register, scoring, findings with photos, PDF report." },
  "audit-playbook":    { icon: "🔎", desc: "Zero-Risk Building Performance Audit: offer, scripts, checklists, scorecard and handoff." },
  "outbound":          { icon: "🗺️", desc: "Territory map: every lead by status, customer sites, areas worked, and buildings not yet contacted." },
  "lead-sheets":       { icon: "📋", desc: "Track and manage inbound sales leads.", external: "https://netorg13787440-my.sharepoint.com/:x:/g/personal/natalie_townsend_alpinehvac_ca/IQDFyXX0JO36RaKmRK5rUj8TATpMgjfqE_WIuufYkn7YIIw?e=cX7qOq" },
  "call-log":          { icon: "📞", desc: "Log on-call coverage and incoming customer calls.", external: "https://docs.google.com/spreadsheets/d/1IaDmMURNjVWhIQZ0eVhDRFjUFVhevVXNHTJ0-BW3ZvM/edit?usp=sharing" },
};
const TOOL_GROUPS = [
  ["Sales", ["service-agreement", "sales-strategy", "audit-tool", "audit-playbook", "case-studies", "outbound", "lead-sheets"]],
  ["Operations", ["ops-dashboard", "job", "service-agreements", "site-reports", "team-hub", "call-log"]],

<script type="module">
import { doc, getDoc, getDocs, setDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import { db, currentUser } from "./ap-firebase.js";

const app = $("app");
const user = await currentUser();
if (!user) { sessionStorage.clear(); location.href = "index.html"; }

// ── Data loaders (each fails soft: a block shows "not available" instead of breaking the page) ──
const json = async (coll, id, field = "json") => { try { const s = await getDoc(doc(db, coll, id)); return s.exists() ? JSON.parse(s.data()[field]) : null; } catch (e) { console.warn("dashboard:", coll, id, e.code || e); return undefined; } };
async function agreements() {
  try {
    const snap = await getDocs(collection(db, "service_agreements_data"));
    const out = []; snap.forEach(d => { if (!d.id.startsWith("sa_agr_")) return; try { const a = JSON.parse(d.data().value); if (a && !a.deleted) out.push(a); } catch (e) {} });
    return out;
  } catch (e) { console.warn("dashboard: agreements", e.code || e); return null; }
}
const outbound = async key => { try { const s = await getDoc(doc(db, "outbound_data", key)); return s.exists() ? JSON.parse(s.data().value) : null; } catch (e) { return undefined; } };

// ── Header ──
const firstName = (session.name || "").split(" ")[0];
const hour = new Date().getHours();
const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
const today = T.toLocaleDateString("en-CA", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const header = (eyebrow, title) => `<div class="top"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1></div><div class="date">${esc(today)}</div></div>`;

// ═══════════ Agreements: renewals due + open quotes ═══════════
function agreementStats(list) {
  const ruleEnd = s => { const d = pd(s); return d ? new Date(d.getFullYear() + 1, d.getMonth(), d.getDate() - 1) : null; };
  const due = [], quotes = [];
  let active = 0, activeAcv = 0, renewed = 0, lost = 0;
  const yearAgo = new Date(T); yearAgo.setFullYear(T.getFullYear() - 1);
  (list || []).forEach(a => {
    if (a.status === "Draft") { quotes.push(a); return; }
    const end = pd(a.endDate) || ruleEnd(a.startDate);
    if (a.renewalStage === "Renewed" && (!end || end >= yearAgo)) renewed++;
    else if ((a.renewalStage === "Lost" || a.status === "Ended") && end && end >= yearAgo && end <= T) lost++;
    if (a.status !== "Active") return;
    active++; activeAcv += Number(a.acv) || 0;
    if (!end) return;
    const days = Math.round((end - T) / 864e5);
    if (days <= 90 && a.renewalStage !== "Renewed") due.push({ a, end, days });
  });
  due.sort((x, y) => x.days - y.days);
  return { due, quotes, active, activeAcv, renewed, lost, quoteAcv: quotes.reduce((s, a) => s + (Number(a.acv) || 0), 0) };
}
function renewalsPanel(st, limit = 6) {
  if (!st) return `<div class="panel"><h3>Renewals due</h3><p class="empty">Agreement data isn't available for this account.</p></div>`;
  const badge = d => d < 0 ? `<span class="badge red">Overdue ${-d}d</span>` : d <= 30 ? `<span class="badge red">${d} days</span>` : d <= 60 ? `<span class="badge amber">${d} days</span>` : `<span class="badge teal">${d} days</span>`;
  const rows = st.due.slice(0, limit).map(x => `<li><a class="grow" href="agreement.html?id=${encodeURIComponent(x.a.id)}">${esc(x.a.name || x.a.id)}<small>${esc(String(x.a.customer || "").replace(/^\*+/, ""))} · ends ${fmtD(x.end)} · ${money(x.a.acv)} ACV${x.a.renewalStage && x.a.renewalStage !== "Not Started" ? " · " + esc(x.a.renewalStage) : ""}</small></a>${badge(x.days)}</li>`).join("");
  return `<div class="panel"><div class="sec-h"><h3>Renewals due · 90 days</h3><a href="service-agreements.html">Tracker →</a></div>
    ${st.due.length ? `<ul class="list">${rows}</ul>${st.due.length > limit ? `<p class="note" style="margin-top:.4rem">+ ${st.due.length - limit} more in the tracker</p>` : ""}` : `<p class="empty">Nothing renewing in the next 90 days.</p>`}
    <p class="note" style="margin-top:.6rem">${st.active} active agreements · ${moneyK(st.activeAcv)} ACV · ${st.quotes.length} open quote${st.quotes.length === 1 ? "" : "s"} (${moneyK(st.quoteAcv)})</p></div>`;
}

// ═══════════ Sales metrics ═══════════
const TOUCH_CH = [["knocks", "Door knocks"], ["calls", "Calls"], ["emails", "Emails"], ["meetings", "Site visits / meetings"]];
// Touches per rep per week come from three sources: the manual log, automatic counts
// (Outlook emails/meetings, src "auto") and Fireflies door-knock recordings. For each rep,
// week and channel the highest source wins, so nothing is counted twice.
function mergedTouches(log, knocks) {
  const cell = {};
  const put = (wk, rep, k, v) => { const id = wk + "|" + rep; cell[id] = cell[id] || { wk, rep }; cell[id][k] = Math.max(cell[id][k] || 0, Number(v) || 0); };
  (log || []).forEach(r => TOUCH_CH.forEach(([k]) => put(r.wk, r.rep, k, r[k])));
  const kn = {}; ((knocks && knocks.rows) || []).forEach(k => { const d = pd(k.date); if (!d) return; const id = iso(monday(d)) + "|" + (k.rep || "Jake"); kn[id] = (kn[id] || 0) + 1; });
  Object.entries(kn).forEach(([id, n]) => { const [wk, rep] = id.split("|"); put(wk, rep, "knocks", n); });
  return Object.values(cell);
}
function touchStats(log, leads, knocks) {
  const wk0 = monday(T), weeks = [];
  for (let i = 7; i >= 0; i--) { const d = new Date(wk0); d.setDate(d.getDate() - i * 7); weeks.push(iso(d)); }
  const rows = mergedTouches(log, knocks).filter(r => weeks.includes(r.wk));
  const tot = r => TOUCH_CH.reduce((s, [k]) => s + (Number(r[k]) || 0), 0);
  if (rows.length) {
    const first = weeks.findIndex(w => rows.some(r => r.wk === w));
    const span = weeks.length - first;                          // weeks since logging started (max 8)
    const total = rows.reduce((s, r) => s + tot(r), 0);
    const by = {}; TOUCH_CH.forEach(([k]) => by[k] = rows.reduce((s, r) => s + (Number(r[k]) || 0), 0));
    return { avg: total / span, span, by, src: "log" };
  }
  // No log yet: leads whose last touch on the lead sheet fell in the last 8 weeks.
  const since = new Date(wk0); since.setDate(since.getDate() - 49);
  const n = ((leads && leads.rows) || []).filter(l => { const d = pd(l.lastTouch); return d && d >= since; }).length;
  return { avg: n / 8, span: 8, by: null, src: "sheet" };
}
function salesKpis(M, ag, touches, leads, compact) {
  const st = ag ? agreementStats(ag) : null;
  // Retention: agreements renewed ÷ agreements that came up for renewal in the last 12 months.
  // Until 3+ renewals have been decided, the QuickBooks repeat-customer rate is used.
  const decided = st ? st.renewed + st.lost : 0;
  const agrRet = decided >= 3 ? st.renewed / decided * 100 : null;
  const ret = agrRet != null ? agrRet : M && M.retentionInvoice;
  const retSub = agrRet != null ? `${st.renewed} of ${decided} agreements renewed, last 12 mo${M && M.retentionInvoice != null ? ` · repeat customers ${M.retentionInvoice}%` : ""}`
    : M && M.retentionInvoice != null ? `Customers billed in the prior 12 months who were billed again (${M.retentionBase} customers). Switches to agreement renewals once 3+ have come up` : "";
  let ltv = null, life = null;
  if (M && M.revPerCustomer && ret != null) { const churn = Math.max(0.1, 1 - ret / 100); life = Math.min(10, 1 / churn); ltv = M.revPerCustomer * (M.grossMargin / 100) * life; }
  const ratio = ltv && M.cac ? ltv / M.cac : null;
  const followDue = ((leads && leads.rows) || []).filter(l => l.followUp && !["Dead", "Converted"].includes(l.status) && l.followUp <= iso(T) && !(l.lastTouch && l.lastTouch >= l.followUp)).length;
  const tiles = [
    kpi(ratio == null ? "" : ratio >= 3 ? "green hero" : ratio >= 1 ? "amber hero" : "red hero", "CAC : LTV", ratio == null ? "—" : "1 : " + ratio.toFixed(ratio >= 10 ? 0 : 1),
      M ? `CAC ${money(M.cac)} (BDR + marketing ${moneyK(M.bdrCostTTM + M.marketingTTM)} ÷ ${M.newCustomersTTM} new customers) · LTV ${moneyK(ltv)} (${moneyK(M.revPerCustomer)}/yr × ${M.grossMargin}% GM × ${life ? life.toFixed(1) : "—"} yrs)` : "Waiting for the first sales metrics update"),
    kpi("", "Touches per week", touches ? Math.round(touches.avg) : "—",
      touches ? (touches.src === "log" ? `Avg over ${touches.span} wk${touches.span === 1 ? "" : "s"} · ${TOUCH_CH.map(([k, l]) => `${l.split(" ")[0].toLowerCase()} ${touches.by[k]}`).join(" · ")}` : "Leads touched per week (lead sheet last-touch dates). Log touches on the Sales dashboard for the full count by channel") : ""),
    kpi("", "Average ticket", M ? money(M.avgTicket) : "—", M ? `${M.invoicesTTM} invoices, last 12 mo, contracts + jobs + projects, before HST · median ${money(M.medianTicket)}` : ""),
    kpi(ret == null ? "" : ret >= 80 ? "green" : ret >= 60 ? "amber" : "red", "Customer retention", ret == null ? "—" : Math.round(ret) + "%", retSub),
    kpi(M && M.growthYoY != null ? (M.growthYoY >= 0 ? "green" : "red") : "", "Revenue growth YoY", M && M.growthYoY != null ? (M.growthYoY >= 0 ? "+" : "") + M.growthYoY + "%" : "—", M ? `${moneyK(M.revenueTTM)} last 12 mo vs ${moneyK(M.revenuePrevTTM)} the 12 before` : ""),
  ];
  if (!compact) tiles.push(
    kpi("", "New customers · 12 mo", M ? M.newCustomersTTM : "—", M ? `${M.customersTTM} customers billed in the last 12 months · ${moneyK(M.revPerCustomer)} each on average` : ""),
    kpi("", "Open agreement quotes", st ? st.quotes.length : "—", st ? `${moneyK(st.quoteAcv)} quoted ACV · ${st.active} active agreements (${moneyK(st.activeAcv)})` : ""),
    kpi(followDue ? "amber" : "green", "Follow-ups due", leads ? followDue : "—", "Leads past their follow-up date with no touch since"),
  );
  else tiles.push(kpi("", "Open agreement quotes", st ? st.quotes.length : "—", st ? `${moneyK(st.quoteAcv)} quoted ACV` : ""), kpi(followDue ? "amber" : "green", "Follow-ups due", leads ? followDue : "—", "Leads past their follow-up date"), kpi("", "New customers · 12 mo", M ? M.newCustomersTTM : "—", M ? `${M.customersTTM} customers billed, last 12 mo` : ""));
  return `<div class="kpis">${tiles.join("")}</div>${M ? `<p class="note" style="margin-top:.5rem">Sales metrics as of ${fmtD(pd(M.asOf))} · ${esc(M.source)}.</p>` : ""}`;
}

// Touch log: one row per rep per week. Saved to outbound_data (sales only).
function touchLogHTML(log, knocks) {
  const reps = ["Natalie", "Jake", "Mike", "Cole"];
  const me = reps.find(r => r === firstName) || reps[0];
  const wkOpts = [0, 1, 2, 3].map(i => { const d = monday(T); d.setDate(d.getDate() - i * 7); return `<option value="${iso(d)}">Week of ${fmtD(d)}</option>`; }).join("");
  const recent = (log || []).filter(r => TOUCH_CH.some(([k]) => r[k])).slice().sort((a, b) => b.wk.localeCompare(a.wk) || a.rep.localeCompare(b.rep)).slice(0, 10);
  const nk = ((knocks && knocks.rows) || []).length;
  return `<div class="panel"><div class="sec-h"><h3>Touches by week</h3><span class="note">Filled automatically: door knocks from Fireflies (${nk} recorded), Jake's prospect emails and meetings from Outlook. Add anything the automation can't see (Natalie's calls and emails) below; the higher number per week wins, never both.</span></div>
    <div class="tl-form">
      <label>Week<select id="tl-wk">${wkOpts}</select></label>
      <label>Rep<select id="tl-rep">${reps.map(r => `<option${r === me ? " selected" : ""}>${r}</option>`).join("")}</select></label>
      ${TOUCH_CH.map(([k, l]) => `<label>${l.replace("Site visits / meetings", "Meetings")}<input type="number" min="0" step="1" id="tl-${k}" placeholder="0"></label>`).join("")}
      <button class="btn" id="tl-save" type="button">Save</button>
    </div>
    <p class="note" id="tl-msg"></p>
    ${recent.length ? `<table class="tl"><thead><tr><th>Week</th><th>Rep</th>${TOUCH_CH.map(([, l]) => `<th>${l.split(" ")[0]}</th>`).join("")}<th>Total</th></tr></thead><tbody>${recent.map(r => `<tr><td>${fmtD(pd(r.wk))}</td><td style="text-align:left">${esc(r.rep)}</td>${TOUCH_CH.map(([k]) => `<td>${Number(r[k]) || 0}</td>`).join("")}<td><b>${TOUCH_CH.reduce((s, [k]) => s + (Number(r[k]) || 0), 0)}</b></td></tr>`).join("")}</tbody></table>` : ""}
  </div>`;
}
function wireTouchLog() {
  const btn = $("tl-save"); if (!btn) return;
  const fill = async () => { const log = (await outbound("ob_touch_log")) || []; const r = log.find(x => !x.src && x.wk === $("tl-wk").value && x.rep === $("tl-rep").value) || {}; TOUCH_CH.forEach(([k]) => $("tl-" + k).value = r[k] != null ? r[k] : ""); };
  $("tl-wk").onchange = fill; $("tl-rep").onchange = fill; fill();
  btn.onclick = async () => {
    btn.disabled = true; $("tl-msg").textContent = "Saving…";
    try {
      const log = (await outbound("ob_touch_log")) || [];          // re-read right before saving
      const row = { wk: $("tl-wk").value, rep: $("tl-rep").value, by: session.email, at: new Date().toISOString() };
      TOUCH_CH.forEach(([k]) => row[k] = Math.max(0, parseInt($("tl-" + k).value, 10) || 0));
      const next = log.filter(x => x.src || !(x.wk === row.wk && x.rep === row.rep)).concat([row]);   // only replaces the manual row; automatic rows are kept
      await setDoc(doc(db, "outbound_data", "ob_touch_log"), { value: JSON.stringify(next), updatedAt: Date.now() });
      $("tl-msg").textContent = "Saved."; setTimeout(() => location.reload(), 600);
    } catch (e) { $("tl-msg").textContent = "Save failed (" + (e.code || e) + "). Nothing was changed."; btn.disabled = false; }
  };
}
// Owners paste the output of sales-metrics.py (QuickBooks) here.
function salesUpdateHTML() {
  if (!has("owner")) return "";
  return `<details class="upd"><summary>Update sales metrics (owners)</summary>
    <textarea id="sm-json" rows="5" placeholder='{"asOf": "...", "revenueTTM": ..., "cac": ...}'></textarea>
    <button class="btn" id="sm-save" type="button">Save metrics</button> <span class="note" id="sm-msg"></span></details>`;
}
function wireSalesUpdate() {
  const b = $("sm-save"); if (!b) return;
  b.onclick = async () => {
    let d; try { d = JSON.parse($("sm-json").value); } catch (e) { $("sm-msg").textContent = "That isn't valid JSON."; return; }
    if (!d.asOf || d.revenueTTM == null) { $("sm-msg").textContent = "Missing asOf or revenueTTM. Not saved."; return; }
    const rec = { json: JSON.stringify(d), asOf: d.asOf, updatedAt: serverTimestamp(), updatedBy: user.email };
    try { await setDoc(doc(db, "sales_dashboard", "latest"), rec); await setDoc(doc(db, "sales_dashboard_history", d.asOf), rec); $("sm-msg").textContent = "Saved. Reloading…"; setTimeout(() => location.reload(), 700); }
    catch (e) { $("sm-msg").textContent = "Save failed: " + (e.code || e); }
  };
}

// ═══════════ Views ═══════════
async function viewSales() {
  app.innerHTML = header("Sales", "Sales Dashboard") + `<div class="sec" id="s-kpis"><p class="loading">Loading sales metrics…</p></div>
    <div class="sec"><div class="sec-h"><h2>Territory</h2><a href="outbound.html">Open Outbound →</a></div>${frame("outbound.html?embed=map", "Territory map")}</div>
    <div class="sec" id="s-touch"></div>${salesUpdateHTML()}`;
  const [M, ag, log, leads, knocks] = await Promise.all([json("sales_dashboard", "latest"), agreements(), outbound("ob_touch_log"), outbound("ob_leads"), outbound("ob_knocks")]);
  $("s-kpis").innerHTML = salesKpis(M || null, ag, touchStats(log, leads, knocks), leads, false);
  $("s-touch").innerHTML = touchLogHTML(mergedTouches(log, knocks), knocks);
  wireTouchLog(); wireSalesUpdate();
}

    <div class="sec"><div class="sec-h"><h2>Operations</h2><a href="dashboard.html?view=operations">Operations dashboard →</a></div>

  window.apJobSearchMount && window.apJobSearchMount();

function viewTools() {
  const visible = apVisibleTools();
  const groups = TOOL_GROUPS.map(([label, ids]) => [label, ids.filter(id => visible.includes(id) && !(id === "job" && visible.includes("ops-dashboard")))]).filter(g => g[1].length);
  app.innerHTML = header("Home", `${greet}${firstName ? ", " + firstName : ""}`) + (groups.length ? groups.map(([label, ids]) => `<div class="tgroup"><h2>${label}</h2><div class="tgrid">${ids.map(id => {
    const m = TOOL_META[id] || {}, lbl = (AP_TOOLS[id] && AP_TOOLS[id].label) || id;
    return `<a class="tcard" href="${m.external || id + ".html"}"${m.external ? ' target="_blank" rel="noopener"' : ""}><span class="ti">${m.icon || "🔧"}</span><span class="tt">${esc(lbl)}</span><span class="td">${esc(m.desc || "")}</span></a>`; }).join("")}</div></div>`).join("")
    : `<p class="empty">No tools are assigned to your account yet. Contact your administrator.</p>`);
}

// Pick the view this person is allowed to see; anything else falls back to Home.
const ALLOWED = { sales: has("sales"), operations: can("ops-dashboard"), financials: can("cash-dashboard") };
document.title = "Alpine HVAC — " + ({ sales: "Sales", operations: "Operations", financials: "Financial" }[VIEW] || "Home");
if (VIEW === "sales" && ALLOWED.sales) await viewSales();
else if (VIEW === "operations" && ALLOWED.operations) await viewOps();
else if (VIEW === "financials" && ALLOWED.financials) viewFin();
else if (has("owner")) await viewOwner();
else viewTools();
</script>
