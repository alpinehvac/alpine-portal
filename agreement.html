<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — Service Agreement</title>
<script src="auth.js"></script>
<script>apGuard("service-agreements");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#27636C;--teal-light:#3D818A;--purple:#6C5D8D;--purple-light:#8A7BB0;
  --black:#EAF2F3;--off-black:#FFFFFF;--charcoal:#E4F0F1;--white:#10444E;
  --red:#B83227;--amber:#A9821F;--green:#2E7D57;--border:rgba(16,68,78,0.12);--radius:8px;--radius-lg:14px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--black);color:var(--white);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}
a{color:var(--teal-light)}
.topbar{position:sticky;top:0;z-index:300;background:var(--black);border-bottom:1px solid rgba(28,107,110,0.35);display:flex;align-items:center;gap:.6rem;padding:0 1rem;min-height:56px;flex-wrap:wrap}
.bar-btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid rgba(16,68,78,0.168);color:rgba(16,68,78,0.715);border-radius:4px;padding:0 12px;height:32px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.bar-btn:hover{color:var(--teal-light);border-color:rgba(28,107,110,0.6)}
.spacer{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:2rem 1.5rem 5rem}
.kicker{font-size:.8rem;color:rgba(16,68,78,0.585);display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.kicker .id{font-family:'Oswald',sans-serif;color:var(--teal-light);letter-spacing:.03em}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;text-transform:uppercase;line-height:1.1;margin:.25rem 0 .2rem}
.cust{font-size:.95rem;color:rgba(16,68,78,0.78)}
h2{font-family:'Oswald',sans-serif;font-size:1.02rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
h2 .note{font-family:'Inter',sans-serif;font-size:.76rem;font-weight:400;text-transform:none;letter-spacing:0;color:rgba(16,68,78,0.52)}
.section{margin-top:2.25rem}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.muted{color:rgba(16,68,78,0.52)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--off-black);overflow:hidden;margin-top:1.4rem}
.fact{padding:.85rem 1.1rem;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.f-label{font-size:.72rem;color:rgba(16,68,78,0.546)}
.f-val{font-size:.95rem;font-weight:500}
.f-val.big{font-family:'Oswald',sans-serif;font-size:1.35rem;font-weight:600}
.badge{display:inline-block;font-size:.7rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.b-red{background:rgba(224,112,95,0.18);color:var(--red)}
.b-amber{background:rgba(217,164,65,0.16);color:var(--amber)}
.b-purple{background:rgba(155,142,196,0.16);color:var(--purple-light)}
.b-teal{background:rgba(42,138,142,0.2);color:#8FC6C8}
.b-grey{background:rgba(16,68,78,0.084);color:rgba(16,68,78,0.65)}
.rule{font-size:.66rem;color:var(--purple-light);border:1px solid rgba(155,142,196,0.35);border-radius:3px;padding:0 4px;margin-left:4px}
.flag-box{border-left:3px solid var(--amber);background:rgba(217,164,65,0.07);padding:.65rem .9rem;font-size:.82rem;border-radius:0 6px 6px 0;margin-top:1rem}
.sel,.inp{background:var(--charcoal);border:1px solid rgba(16,68,78,0.168);border-radius:6px;padding:.4rem .6rem;font-size:.83rem}
.btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:.45rem .9rem;cursor:pointer;border:1px solid rgba(16,68,78,0.21);background:none;color:rgba(16,68,78,0.92);text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:rgba(16,68,78,0.455);color:var(--white)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#FFFFFF}

.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.qcell{background:var(--off-black);padding:.9rem 1rem}
.qcell.future{opacity:.4}
.qcell.current{box-shadow:inset 0 2px 0 var(--purple-light)}
.qcell.ytd{background:rgba(28,107,110,0.14)}
.q-label{font-size:.74rem;color:rgba(16,68,78,0.585);margin-bottom:.3rem;display:flex;justify-content:space-between}
.q-row{display:flex;align-items:baseline;gap:6px;line-height:1.35}
.q-row b{font-family:'Oswald',sans-serif;font-size:1.2rem;font-weight:600}
.q-row span{font-size:.72rem;color:rgba(16,68,78,0.624)}
.minibar{height:4px;border-radius:99px;background:rgba(16,68,78,0.112);overflow:hidden;margin-top:.45rem}
.minibar i{display:block;height:100%;background:var(--teal-light);color:#FFFFFF}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--off-black)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{font-weight:500;font-size:.72rem;color:rgba(16,68,78,0.546);text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:.55rem .8rem;border-bottom:1px solid rgba(16,68,78,0.07);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.qsep td{background:rgba(16,68,78,0.035);font-size:.72rem;font-weight:600;color:var(--teal-light);padding:.4rem .8rem}
.empty{padding:1.5rem;text-align:center;color:rgba(16,68,78,0.52);font-size:.85rem}

.job{border:1px solid var(--border);border-radius:var(--radius);background:var(--off-black);padding:.75rem 1rem;margin-bottom:.55rem}
.job-top{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.82rem}
.job-top a{font-family:'Oswald',sans-serif;text-decoration:none}
.job-title{font-size:.9rem;margin-top:.25rem}
.visits{list-style:none;font-size:.78rem;color:rgba(16,68,78,0.845);margin-top:.35rem;display:flex;flex-direction:column;gap:.2rem}
.visits b{color:rgba(16,68,78,0.92);font-weight:500}
.q-head{font-size:.76rem;font-weight:600;color:var(--teal-light);margin:1.1rem 0 .45rem}

.renew{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--off-black);padding:1rem 1.1rem}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:.72rem;color:rgba(16,68,78,0.585)}
.fld.full{grid-column:1/-1}
textarea.inp{min-height:70px;resize:vertical}
.hist{list-style:none;font-size:.78rem;color:rgba(16,68,78,0.65);display:flex;flex-direction:column;gap:.3rem;margin-top:.6rem}
.hist b{color:rgba(16,68,78,0.92);font-weight:500}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--charcoal);border:1px solid rgba(28,107,110,0.6);border-radius:8px;padding:.65rem 1rem;font-size:.83rem;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:760px){.qgrid{grid-template-columns:repeat(2,1fr)}.renew{grid-template-columns:1fr 1fr}.wrap{padding:1.5rem 1rem 4rem}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="topbar">
  <a class="bar-btn" href="service-agreements.html">← Agreements</a>
  <span class="spacer"></span>
  <a class="bar-btn" id="lnk-site" href="site-reports.html">🗂️ Site report</a>
  <a class="bar-btn" id="lnk-bo" href="#" target="_blank" rel="noopener">Open in BuildOps ↗</a>
  <a class="bar-btn" id="lnk-edit" href="service-agreements.html">Edit / renew</a>
  <a class="bar-btn" href="dashboard.html">🏠 Dashboard</a>
</div>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>
<div class="toast" id="toast" role="status"></div>
<script>
  window.AP_SYNC_COLLECTION = "service_agreements_data";
  window.AP_SYNC_ROUTES = { "sr_": "site_reports_data", "st_": "site_data" };
  window.AP_APP_SCRIPT = "agreement-app.js";
</script>
<script type="module" src="cloud-sync.js"></script>
</body>
</html>
