<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — Job Profit</title>
<script src="auth.js"></script>
<script>if (typeof apGuard === "function") apGuard("job-profit");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ALPINE CASH DASHBOARD — portal version. Contains NO financial data: numbers load from Firestore (cash_dashboard/latest) after sign-in; access limited to the finance role (Jake, Mike, Clarissa) by auth.js and firestore.rules. -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#27636C;--teal-light:#3D818A;--teal-dark:#10444E;
  --purple:#6C5D8D;
  --black:#EAF2F3;--off-black:#FFFFFF;--charcoal:#E4F0F1;
  --grey:#5A7A80;--light-grey:#5A7A80;--white:#10444E;
  --amber:#A9821F;--red:#B83227;--green:#2E7D57;
  --border:rgba(16,68,78,0.12);--radius:8px;--radius-lg:14px;
}
html,body{min-height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--black);color:var(--white);font-size:15px;line-height:1.5}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}

nav{position:sticky;top:0;z-index:100;background:var(--black);border-bottom:1px solid rgba(28,107,110,0.35)}
.nav-inner{max-width:1160px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-icon{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-wordmark{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.nav-wordmark small{display:block;font-size:9px;font-weight:400;letter-spacing:.18em;color:var(--teal-light);margin-top:2px}
.back-link{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(16,68,78,0.715);text-decoration:none;border:1px solid rgba(16,68,78,0.21);border-radius:6px;padding:8px 14px}
.back-link:hover{color:var(--white);border-color:rgba(16,68,78,0.455)}

.wrap{max-width:1160px;margin:0 auto;padding:2rem 2rem 5rem}
.sample-banner{background:rgba(226,168,69,0.1);border:1px solid rgba(226,168,69,0.35);color:#8A6A12;border-radius:var(--radius);padding:.7rem 1rem;font-size:.85rem;margin-bottom:2rem}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.75rem}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.8rem,4vw,2.4rem);font-weight:700;text-transform:uppercase;line-height:1.1}
.asof{font-size:.85rem;color:var(--light-grey)}
.asof b{color:var(--white);font-weight:500}

.verdict{border-left:6px solid var(--green);padding:.4rem 0 .4rem 1.4rem;margin-bottom:2.25rem}
.verdict.warn{border-color:var(--amber)}
.verdict.alert{border-color:var(--red)}
.verdict-line{font-family:'Oswald',sans-serif;font-size:clamp(1.5rem,3.4vw,2.25rem);font-weight:600;line-height:1.15;max-width:30ch}
.verdict-sub{margin-top:.6rem;color:rgba(16,68,78,0.92);max-width:75ch}

.metrics{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:2.5rem}
.metric{padding:1.1rem 1rem 1.2rem;border-right:1px solid var(--border)}
.metric:last-child{border-right:none}
.m-label{font-size:.8rem;color:var(--light-grey);margin-bottom:.35rem;min-height:2.4em}
.m-value{font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:500;line-height:1.1}
.m-sub{font-size:.78rem;color:var(--light-grey);margin-top:.25rem}
.m-trend{font-size:.78rem;margin-top:.4rem;color:var(--light-grey)}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--light-grey)}.watch{color:var(--amber)}

section{margin-bottom:2.75rem}
h2{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.35rem}
.h2-note{font-size:.85rem;color:var(--light-grey);margin-bottom:1rem;max-width:78ch}

.chart-box{background:var(--off-black);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1rem .75rem}
.chart-scroll{overflow-x:auto}
.chart-box svg{display:block;width:100%;min-width:700px;height:auto}
.legend{display:flex;gap:1.25rem;flex-wrap:wrap;font-size:.8rem;color:var(--light-grey);padding:.5rem .5rem 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart-tip{position:fixed;pointer-events:none;background:var(--charcoal);border:1px solid rgba(16,68,78,0.21);border-radius:6px;padding:.55rem .7rem;font-size:.8rem;line-height:1.45;display:none;z-index:200;max-width:250px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.panel{background:var(--off-black);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.4rem}
.ratio{font-family:'Oswald',sans-serif;font-size:2.4rem;font-weight:500;line-height:1}
.ratio-sub{font-size:.85rem;color:var(--light-grey);margin:.4rem 0 1.25rem}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.phase{padding:.6rem .4rem;text-align:center;font-size:.78rem;border-radius:4px;background:rgba(16,68,78,0.056);color:var(--light-grey)}
.phase small{display:block;font-size:.7rem;opacity:.75;margin-top:2px}
.phase.on{color:var(--black);font-weight:600}
#view-toggle .phase{border:none;cursor:pointer;font:inherit;font-size:.78rem;padding:.45rem .8rem}
.phase.on.p0{background:var(--green);color:#FFFFFF}.phase.on.p1{background:var(--amber);color:#FFFFFF}.phase.on.p2{background:#C26A2B}.phase.on.p3{background:var(--red);color:#FFFFFF}
.risk-list{list-style:none;counter-reset:r}
.risk-list li{counter-increment:r;display:grid;grid-template-columns:1.6rem 1fr auto;gap:.5rem;padding:.7rem 0;border-bottom:1px solid var(--border);align-items:baseline}
.risk-list li:last-child{border-bottom:none}
.risk-list li::before{content:counter(r) ".";color:var(--light-grey);font-size:.85rem}
.risk-name{font-weight:500}
.risk-meta{font-size:.8rem;color:var(--light-grey)}
.risk-amt{font-family:'Oswald',sans-serif;font-size:1.1rem;text-align:right}
.risk-days{font-size:.78rem;text-align:right}

/* Monthly health */
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.h-card{background:var(--off-black);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.3rem;display:flex;flex-direction:column;gap:.3rem}
.h-card.wide{grid-column:span 2}
.h-card.full{grid-column:1 / -1}
.h-label{font-size:.85rem;color:var(--light-grey)}
.h-value{font-family:'Oswald',sans-serif;font-size:1.9rem;font-weight:500;line-height:1.1}
.h-foot{font-size:.8rem;color:var(--light-grey)}
.h-status{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.bars{display:grid;gap:.65rem;margin-top:.4rem}
.bar-row{display:grid;grid-template-columns:9.5rem 1fr 3.5rem;gap:.75rem;align-items:center;font-size:.85rem}
.bar-track{position:relative;height:10px;background:rgba(16,68,78,0.084);border-radius:5px}
.bar-band{position:absolute;top:-3px;bottom:-3px;background:rgba(16,68,78,0.112);border-left:1px solid rgba(16,68,78,0.35);border-right:1px solid rgba(16,68,78,0.35)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar-val{text-align:right;font-variant-numeric:tabular-nums}
.crew{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.6rem;padding-top:.8rem;border-top:1px solid var(--border)}
.crew label{font-size:.8rem;color:var(--light-grey);display:flex;flex-direction:column;gap:.3rem}
.crew input{width:6.5rem;background:var(--black);border:1px solid rgba(16,68,78,0.252);border-radius:6px;color:var(--white);font:inherit;font-size:.95rem;padding:.4rem .6rem}
.crew input:focus{border-color:var(--teal-light);outline:none}
.saved{font-size:.75rem;color:var(--green);align-self:flex-end;padding-bottom:.45rem;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg)}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
th{font-weight:500;color:var(--light-grey);text-align:right;padding:.75rem 1rem;border-bottom:1px solid var(--border);background:var(--off-black)}
th:first-child,td:first-child{text-align:left}
td{padding:.7rem 1rem;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
tr.week{cursor:pointer}
tr.week:hover td{background:rgba(16,68,78,0.035)}
tr.week td:first-child::before{content:'+';display:inline-block;width:1rem;color:var(--light-grey)}
tr.week.open td:first-child::before{content:'–'}
tr.breach td{color:#F2A395}
tr.detail{display:none}
tr.detail.open{display:table-row}
tr.detail td{background:rgba(16,68,78,0.028);text-align:left;padding:.9rem 1rem 1.1rem 2rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:2rem;font-size:.84rem}
.split h4{font-weight:500;margin-bottom:.35rem;color:var(--light-grey)}
.split div div{display:flex;justify-content:space-between;padding:2px 0}
.driver{margin-top:.6rem;font-size:.84rem;color:rgba(16,68,78,0.92)}
.flag{font-size:.75rem;padding:2px 7px;border-radius:10px;margin-left:6px}
.flag.red{background:rgba(224,112,94,0.18);color:#F2A395}
.flag.amber{background:rgba(226,168,69,0.16);color:#8A6A12}

.checks{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.check{display:flex;gap:.6rem;align-items:baseline;padding:.35rem 0;font-size:.9rem}
.ok{color:var(--green)}.bad{color:var(--red)}
.assume{list-style:decimal;padding-left:1.2rem;font-size:.88rem;color:rgba(16,68,78,0.92)}
.assume li{padding:.25rem 0}

@media (max-width:1000px){
  .metrics{grid-template-columns:repeat(3,1fr)}
  .metric{border-bottom:1px solid var(--border)}
  .metric:nth-child(3n){border-right:none}
  .health{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .metric:nth-child(3n){border-right:1px solid var(--border)}
  .metric:nth-child(2n){border-right:none}
  .two,.checks,.health{grid-template-columns:1fr}
  .h-card.wide,.h-card.full{grid-column:auto}
}
@media (max-width:560px){
  .wrap{padding:1.5rem 1rem 4rem}
  .nav-inner{padding:0 1rem}
  .split{grid-template-columns:1fr;gap:1rem}
  .bar-row{grid-template-columns:7rem 1fr 3rem}
}
</style>
<style>
.live-banner{background:rgba(42,138,142,0.1);border:1px solid rgba(42,138,142,0.4);color:#27636C;border-radius:8px;padding:.7rem 1rem;font-size:.85rem;margin-bottom:2rem}
.acct{width:100%;border-collapse:collapse;font-size:.88rem;min-width:0}
.acct td,.acct th{padding:.45rem 0;border-bottom:1px solid var(--border);background:none;text-align:right}
.acct td:first-child,.acct th:first-child{text-align:left}
.acct tr.sub td{color:var(--light-grey);font-size:.82rem}
.acct tr.total td{font-weight:600;border-bottom:none;padding-top:.7rem}
.acct h5{font-weight:500;color:var(--light-grey);font-size:.8rem;margin:1rem 0 .2rem;text-transform:uppercase;letter-spacing:.05em}
.kv{display:flex;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.88rem;gap:1rem}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-bars{display:flex;align-items:flex-end;gap:4px;height:70px;margin:.8rem 0 .3rem}
.mini-bars div{flex:1;background:rgba(42,138,142,0.55);border-radius:2px 2px 0 0;min-height:2px}
.mini-bars div.last4{background:#3D818A;color:#FFFFFF}
.pend{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;background:rgba(226,168,69,0.16);color:#8A6A12;margin-left:.4rem;vertical-align:2px}
.jobs td{font-size:.84rem}
.warnbox{border:1px solid rgba(224,112,94,0.4);background:rgba(224,112,94,0.08);border-radius:8px;padding:.8rem 1rem;font-size:.86rem;margin-top:1rem;color:#B83227}
.levers{list-style:decimal;padding-left:1.2rem;font-size:.88rem;color:rgba(16,68,78,0.92);margin-top:.6rem}
.levers li{padding:.2rem 0}
</style>

<style>
.jt tr.job{cursor:pointer}.jt tr.job:hover td{background:rgba(16,68,78,0.035)}
.jt tr.job td:first-child::before{content:'+';display:inline-block;width:1rem;color:var(--light-grey)}
.jt tr.job.open td:first-child::before{content:'–'}
.jt tr.det{display:none}.jt tr.det.open{display:table-row}
.jt tr.det>td{background:rgba(16,68,78,0.028);text-align:left;padding:1rem 1.2rem 1.4rem}
.dgrid{display:grid;grid-template-columns:1fr 1.6fr;gap:1.5rem}
.mini{width:100%;border-collapse:collapse;font-size:.82rem;min-width:0}
.mini th,.mini td{padding:.35rem .4rem;border-bottom:1px solid var(--border);background:none;text-align:right}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini td.memo{text-align:left;color:var(--light-grey);font-size:.78rem;max-width:280px}
.bar{height:6px;background:var(--teal-light);border-radius:3px;color:#FFFFFF}
.summary{background:rgba(42,138,142,0.08);border:1px solid rgba(42,138,142,0.3);border-radius:8px;padding:.7rem .9rem;font-size:.86rem;margin-bottom:1rem}
@media (max-width:800px){.dgrid{grid-template-columns:1fr}}
</style>

</head>
<body>
<nav><div class="nav-inner">
  <a class="nav-logo" href="dashboard.html"><div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M3 20 L9 9 L13 15 L16 11 L21 20 Z"/></svg></div>
  <div class="nav-wordmark">Alpine HVAC<small>Internal Portal</small></div></a>
  <a class="back-link" href="dashboard.html?cat=financials">&larr; Financials</a>
</div></nav>
<main class="wrap">
  <div class="head"><h1>Job Profit</h1><div class="asof" id="asof"></div></div>
  <p class="h2-note" style="margin-top:-1rem">Labour from BuildOps job costing (hours × $70, the quoting rate). Materials and billing from QuickBooks by PO. Before HST. Select a job to see the breakdown.</p>
  <section><h2>Open jobs</h2><div class="table-wrap"><table class="jt" id="open"></table></div></section>
  <section><h2>Completed jobs: quoted vs actual</h2><div class="table-wrap"><table class="jt" id="done"></table></div></section>
  <p><a class="back-link" href="cash-dashboard.html" style="display:inline-block">&larr; Financial Position</a></p>
</main>
<script>
const fmt=n=>(n<0?"−$":"$")+Math.abs(Math.round(n)).toLocaleString("en-CA");
const pct=(n,dp=0)=>n.toFixed(dp)+"%";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dS=s=>new Date(s+"T12:00:00").toLocaleDateString("en-CA",{month:"short",day:"numeric"});
function detail(name,ctx){
  const J=(DATA.profit.jobDetail||{})[name]; if(!J) return `<div class="h-foot">No breakdown captured for this job yet.</div>`;
  const lt=J.labour.reduce((a,b)=>a+b.cost,0), mt=J.materials.reduce((a,b)=>a+b.amount,0), it=J.invoices.reduce((a,b)=>a+b.amount,0), mx=Math.max(1,...J.labour.map(x=>x.cost));
  let sum="";
  if(ctx.estHrs!=null){ const dh=(lt/70)-ctx.estHrs, dm=mt-ctx.estMat, top=J.labour.filter(x=>!x.name.startsWith("Not")).slice(0,2).map(x=>`${x.name} ${x.hrs} hrs`).join(", "), tm=J.materials.slice(0,3).map(x=>`${x.vendor} ${fmt(x.amount)}`).join(", ");
    sum=`<div class="summary"><b>Where it went:</b> labour ${dh>=0?"+":""}${dh.toFixed(0)} hrs vs budget (${top||"no tech detail"}); materials ${dm>=0?"+":""}${fmt(dm)} vs estimate${tm?` (largest: ${esc(tm)})`:""}${ctx.billDelta?`; billing ${ctx.billDelta>0?"+":""}${fmt(ctx.billDelta)} vs quote`:""}.</div>`; }
  else if(ctx.note) sum=`<div class="summary">${esc(ctx.note)}</div>`;
  return sum+`<div class="dgrid"><div>
    <h4 style="font-weight:500;margin-bottom:.4rem">Labour by tech (${(lt/70).toFixed(1)} hrs, ${fmt(lt)})</h4>
    <table class="mini"><thead><tr><th>Tech</th><th>Hours</th><th>Cost</th><th style="width:35%"></th></tr></thead><tbody>${J.labour.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.hrs}</td><td>${fmt(x.cost)}</td><td><div class="bar" style="width:${x.cost/mx*100}%"></div></td></tr>`).join("")||`<tr><td colspan="4">No labour logged yet</td></tr>`}</tbody></table>
    <h4 style="font-weight:500;margin:1rem 0 .4rem">Invoices in QuickBooks (${fmt(it)})</h4>
    <table class="mini"><tbody>${J.invoices.map(x=>`<tr><td>${esc(x.doc)} · ${dS(x.date)}</td><td>${fmt(x.amount)}</td><td>${x.balance>0?'<span class="flag amber">unpaid</span>':''}</td></tr>`).join("")||`<tr><td>None on this PO yet</td></tr>`}</tbody></table>
  </div><div>
    <h4 style="font-weight:500;margin-bottom:.4rem">Materials and subs by bill (${J.materials.length} bills, ${fmt(mt)})</h4>
    <table class="mini"><thead><tr><th>Vendor</th><th>Date</th><th>Amount</th><th style="text-align:left">QuickBooks memo</th></tr></thead><tbody>${J.materials.slice(0,15).map(x=>`<tr><td>${esc(x.vendor)}</td><td>${dS(x.date)}</td><td>${fmt(x.amount)}</td><td class="memo">${esc(x.memo||"—")}</td></tr>`).join("")||`<tr><td colspan="4">No bills on this PO yet</td></tr>`}
    ${J.materials.length>15?`<tr><td colspan="4" style="text-align:left;color:var(--light-grey)">+ ${J.materials.length-15} smaller bills (${fmt(J.materials.slice(15).reduce((a,b)=>a+b.amount,0))})</td></tr>`:""}</tbody></table>
  </div></div>`;
}
function wire(id){document.querySelectorAll("#"+id+" tr.job").forEach(tr=>tr.onclick=()=>{const o=tr.classList.toggle("open");document.getElementById(tr.dataset.d).classList.toggle("open",o);});}
function render(){
  const P=DATA.profit; document.getElementById("asof").innerHTML=`As of <b>${new Date(DATA.asOf+"T12:00:00").toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric",year:"numeric"})}</b>`;
  const W=[...P.wip].sort((a,b)=>b.underBilled-a.underBilled);
  document.getElementById("open").innerHTML=`<thead><tr><th>Job</th><th>% complete</th><th>Cost to date vs estimate</th><th>Earned</th><th>Billed</th><th>Earned not billed</th></tr></thead><tbody>`+
    W.map((w,i)=>`<tr class="job" data-d="od${i}"><td>${esc(w.name)}${w.scopeChanging?' <span class="flag amber">scope changing</span>':''}${w.overBudget?' <span class="flag red">over budget</span>':''}</td><td>${w.pct}%</td><td>${fmt(w.costIncurred)} of ${fmt(w.costEst)}</td><td>${fmt(w.earned)}</td><td>${fmt(w.billed)}</td><td class="${w.underBilled>5000?"watch":""}">${fmt(w.underBilled)}</td></tr><tr class="det" id="od${i}"><td colspan="6">${detail(w.name,{note:w.note})}</td></tr>`).join("")+`</tbody>`;
  const C=P.completed||[];
  document.getElementById("done").innerHTML=`<thead><tr><th>Job</th><th>Projected profit</th><th>Actual profit</th><th>Variance</th><th>Labour</th><th>Materials</th><th>Billing</th></tr></thead><tbody>`+
    C.map((c,i)=>{const proj=c.quoted-c.estLab-c.estMat, act=c.billed-c.actLab-c.actMat, v=act-proj, lv=c.estLab-c.actLab, mv=c.estMat-c.actMat, bv=c.billed-c.quoted, cl=x=>x<0?"down":x>0?"up":"";
      return `<tr class="job" data-d="cd${i}"><td>${esc(c.name)}<br><span style="color:var(--light-grey);font-size:.78rem">${esc(c.job)} · ${esc(c.po)}</span></td><td>${fmt(proj)} <span style="color:var(--light-grey)">${pct(proj/c.quoted*100)}</span></td><td>${fmt(act)} <span style="color:var(--light-grey)">${pct(act/Math.max(c.billed,1)*100)}</span></td><td class="${cl(v)}"><b>${fmt(v)}</b></td><td class="${cl(lv)}">${fmt(lv)}<br><span style="color:var(--light-grey)">${c.actHrs} of ${c.estHrs} hrs</span></td><td class="${cl(mv)}">${fmt(mv)}</td><td class="${cl(bv)}">${fmt(bv)}</td></tr>
      <tr class="det" id="cd${i}"><td colspan="7">${c.notes?`<div class="h-foot" style="margin-bottom:.6rem">${esc(c.notes)}</div>`:""}${detail(c.name,{estHrs:c.estHrs,estMat:c.estMat,billDelta:bv})}</td></tr>`;}).join("")+`</tbody>`;
  wire("open"); wire("done");
}
let DATA=null; window.apCashStart=d=>{DATA=d; if(!DATA.profit){document.querySelector("main").insertAdjacentHTML("afterbegin",'<div class="verdict alert"><div class="verdict-line">No job data yet.</div></div>');return;} render();};
</script>
<script type="module">
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import { db, currentUser } from "./ap-firebase.js";
const user = await currentUser();
if (!user) { sessionStorage.clear(); window.location.href = "index.html"; }
else {
  try { const snap = await getDoc(doc(db, "cash_dashboard", "latest")); if (snap.exists()) window.apCashStart(JSON.parse(snap.data().json)); }
  catch (e) { document.querySelector("main").insertAdjacentHTML("afterbegin", `<div class="verdict alert"><div class="verdict-line">Access denied or offline.</div><div class="verdict-sub">This page is limited to Jake, Mike and Clarissa. (${e.code})</div></div>`); }
}
</script>
</body></html>
