<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — Invoicing</title>
<script src="auth.js"></script>
<script>if (typeof apGuard === "function") apGuard("invoicing");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ALPINE INVOICING — Operations > Invoicing (Jake, Mike, Cole). Contains NO job data: everything loads from
     Firestore after sign-in. The page builds the queue live from:
       ops_dashboard/latest      the jobs on the board (daily refresh)
       ops_jobs/{id}             "Mark complete" and other clicks on the board (live)
       invoicing_data/sweep      the daily sweep: possibly missed work, recipients, email drafts, contract customers and
                                 which BuildOps invoices are in QuickBooks (Part B6 of JOB-DETAILS-REFRESH.md)
       invoicing_data/{id}       what people review and edit here, one document per job (live)
     Detail panels read ops_job_detail/{id} and ops_job_costs/{id}.
     The Draft invoice in BuildOps is built by Claude in a live session: INVOICING-CREATE.md.
     Looks: the board copies the Field Operations pipeline CSS, the review copies the job page. Keep them in step.
     Jobs and projects only for now: service agreement billing stays with Clarissa and is not on this page. -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#27636C;--teal-light:#3D818A;--teal-dark:#10444E;--purple:#6C5D8D;
  --bg:#EAF2F3;--card:#FFFFFF;--ink:#10444E;--muted:#5A7A80;
  --amber:#A9821F;--red:#B83227;--green:#2E7D57;
  --border:rgba(16,68,78,0.12);--radius:8px;--radius-lg:14px;
}
html,body{min-height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}
nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid rgba(28,107,110,0.35)}
.nav-inner{max-width:1240px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;gap:1rem}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-icon{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-wordmark{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.nav-wordmark small{display:block;font-size:9px;font-weight:400;letter-spacing:.18em;margin-top:2px}
.back-link,.btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid rgba(16,68,78,0.25);border-radius:6px;padding:.5rem .85rem;background:var(--card);cursor:pointer;white-space:nowrap;display:inline-block}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-dark)}
.wrap{max-width:1240px;margin:0 auto;padding:2rem 2rem 5rem}
.banner{border-radius:var(--radius);padding:.7rem 1rem;font-size:.85rem;margin-bottom:1.5rem;background:rgba(224,112,94,0.08);border:1px solid rgba(224,112,94,0.4);color:var(--red)}
.banner.info{background:rgba(42,138,142,0.1);border-color:rgba(42,138,142,0.4);color:var(--teal)}
.crumb{font-size:.82rem;color:var(--muted);margin-bottom:.4rem}
.crumb a{color:var(--teal);text-decoration:none}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:700;text-transform:uppercase;line-height:1.1}
.sub{color:var(--muted);margin-top:.35rem;font-size:.92rem}
.sub b{color:var(--ink);font-weight:500}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tag.red{background:rgba(224,112,94,0.16);color:var(--red)}
.tag.amber{background:rgba(226,168,69,0.16);color:#8A6A12}
.tag.teal{background:rgba(42,138,142,0.2);color:var(--teal)}
.tag.purple{background:rgba(155,142,196,0.2);color:#4E4268}
.tag.grey{background:rgba(16,68,78,0.08);color:var(--muted)}
.tag.green{background:rgba(46,125,87,0.14);color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:2rem}
.kpi{padding:1rem 1rem 1.1rem;border-right:1px solid var(--border)}
.kpi:last-child{border-right:none}
.k-label{font-size:.78rem;color:var(--muted);margin-bottom:.3rem}
.k-value{font-family:'Oswald',sans-serif;font-size:1.55rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.k-sub{font-size:.76rem;color:var(--muted);margin-top:.2rem}
.bad{color:var(--red)}.good{color:var(--green)}.watch{color:var(--amber)}.dim{color:var(--muted)}
section{margin-bottom:2.5rem}
h2{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.3rem}
h2 .lock{font-family:'Inter',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:0;text-transform:none;color:#4E4268;background:rgba(155,142,196,0.2);border-radius:10px;padding:2px 8px;margin-left:.5rem;vertical-align:2px}
.h2-row{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
.note{font-size:.85rem;color:var(--muted);max-width:80ch}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.3rem}
.scope{white-space:pre-line;font-size:.92rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}

/* Visits */
.vtools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;font-size:.85rem}
.vtools label{display:flex;gap:.35rem;align-items:center;color:var(--muted)}
.visit{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.8rem;overflow:hidden}
.visit.off{opacity:.55}
.vh{display:grid;grid-template-columns:auto 6.5rem 1fr auto;gap:1rem;align-items:start;padding:1rem 1.2rem;cursor:pointer}
.vh input{margin-top:.3rem;width:16px;height:16px;accent-color:var(--teal)}
.vdate{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:500;line-height:1.15}
.vdate small{display:block;font-family:'Inter',sans-serif;font-size:.74rem;color:var(--muted);font-weight:400}
.vtitle{font-weight:600}
.vtech{font-size:.82rem;color:var(--muted)}
.vsum{font-size:.88rem;margin-top:.35rem;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.visit.open .vsum{display:none}
.vright{text-align:right;font-size:.82rem;color:var(--muted);white-space:nowrap}
.vright b{display:block;font-family:'Oswald',sans-serif;font-size:1.05rem;color:var(--ink);font-weight:500}
.vb{display:none;border-top:1px solid var(--border);padding:1rem 1.2rem 1.2rem 3.4rem}
.visit.open .vb{display:block}
.blk{margin-bottom:1rem}
.blk:last-child{margin-bottom:0}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.5rem}
.ph-grid figure{margin:0}
.ph-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--border);background:rgba(16,68,78,.06)}
.ph-grid figcaption{font-size:.7rem;color:var(--muted);margin-top:.2rem}
.blk h4{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.blk h4 .tag{margin-left:.4rem;letter-spacing:0;text-transform:none;font-weight:500}
.sumtxt{white-space:pre-line;font-size:.9rem}
.sumtxt+.sumtxt{margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--border)}
.by{font-size:.75rem;color:var(--muted);margin-top:.15rem}
ul.plain{list-style:none;font-size:.88rem}
ul.plain li{padding:.2rem 0}
.empty{color:var(--muted);font-size:.88rem}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-weight:500;color:var(--muted);text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:.6rem .8rem;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:600;border-top:1px solid var(--border)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--muted);font-size:.76rem}
td a{color:var(--teal);text-decoration:none}td a:hover{text-decoration:underline}
.bar{height:8px;background:rgba(16,68,78,0.1);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--teal-light)}
.bar i.over{background:var(--red)}
.hbig{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.hbig .bar{flex:1;height:12px}

/* Job list */
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem}
.filters input,.filters select{background:var(--card);color:var(--ink);border:1px solid rgba(16,68,78,0.25);border-radius:6px;padding:.45rem .6rem;font:inherit;font-size:.86rem}
.filters input{min-width:16rem}
tr.go{cursor:pointer}tr.go:hover td{background:rgba(16,68,78,0.035)}


/* Field Operations names for the same colours */
:root{--off-black:#FFFFFF;--light-grey:var(--muted);--grey:#5A7A80;--white:var(--ink)}
/* Pipeline: Field Operations layout. Job pipeline rules below are copied from ops-dashboard.html */
.pipe-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.pipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem;align-items:start}
.col{min-width:0;background:rgba(16,68,78,0.045);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.8rem;min-height:12rem}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.2rem .3rem .75rem;border-bottom:3px solid var(--grey);margin-bottom:.8rem}
.col.q .col-h{border-color:var(--amber)}.col.a .col-h{border-color:var(--teal-light)}.col.p .col-h{border-color:var(--purple)}
.col-h h3{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.col-h h3 .n{font-family:'Inter',sans-serif;font-size:.78rem;font-weight:500;color:var(--light-grey);margin-left:.4rem}
.col-h .tot{font-family:'Oswald',sans-serif;font-size:1rem;font-variant-numeric:tabular-nums}
.col-h .tot small{display:block;font-family:'Inter',sans-serif;font-size:.7rem;color:var(--light-grey);text-align:right}
.col-empty{font-size:.84rem;color:var(--light-grey);padding:.8rem .4rem;line-height:1.45}
.jc{background:var(--off-black);border:1px solid var(--border);border-left:4px solid var(--teal-light);border-radius:10px;margin-bottom:.7rem;box-shadow:0 1px 3px rgba(16,68,78,.06)}
.col.q .jc{border-left-color:var(--amber)}.col.p .jc{border-left-color:var(--purple)}
.jc summary{list-style:none;cursor:pointer;padding:.75rem .85rem .7rem}
.jc summary::-webkit-details-marker{display:none}
.jc-top{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline}
.jc-id{font-size:.75rem;color:var(--light-grey);font-variant-numeric:tabular-nums}
.jc-id a{color:#27636C;text-decoration:none}.jc-id a:hover{text-decoration:underline}
.jc-amt{font-family:'Oswald',sans-serif;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.jc-cust{font-weight:600;font-size:.92rem;line-height:1.3;margin-top:.15rem}
.jc-site{font-size:.8rem;color:var(--light-grey)}
.jc-scope{font-size:.82rem;line-height:1.45;margin-top:.45rem;color:rgba(16,68,78,0.92)}
.jc-meta{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}
.jc-meta .tag{font-size:.7rem}
.jc-body{padding:0 .85rem .85rem;border-top:1px solid var(--border)}
.jc summary{position:relative;padding-right:2rem !important}
.found{list-style:none;margin-bottom:.2rem}
.found li{display:grid;grid-template-columns:3.4rem 1fr;gap:.4rem;font-size:.8rem;line-height:1.4;padding:.3rem 0;border-bottom:1px dashed var(--border)}
.found li:last-child{border-bottom:none}
.found .fd{color:var(--light-grey);font-variant-numeric:tabular-nums}
.found small{display:block;font-size:.7rem;color:var(--light-grey)}
.jc .chev{position:absolute;right:.7rem;bottom:.85rem;font-size:.8rem;color:var(--light-grey);transition:transform .15s}
.jc[open] .chev{transform:rotate(180deg)}
.jc summary:hover .chev{color:#27636C}
.jc[open]{border-color:rgba(16,68,78,0.25)}
.jc-sec{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--light-grey);margin:.75rem 0 .35rem;display:flex;justify-content:space-between}
.pbar{height:8px;background:rgba(16,68,78,0.1);border-radius:4px;overflow:hidden;margin-top:.55rem}
.pbar i{display:block;height:100%;background:var(--purple);border-radius:4px}
.pbar i.full{background:var(--green)}
.pbar i.over{background:var(--red)}
.pct{font-family:'Oswald',sans-serif;font-size:1.35rem;line-height:1}
.pbar{height:8px;background:rgba(16,68,78,0.1);border-radius:4px;overflow:hidden;margin-top:.55rem}
.pbar i{display:block;height:100%;background:var(--purple);border-radius:4px}
.pbar i.full{background:var(--green)}
.pbar i.over{background:var(--red)}
.jc-why{font-size:.8rem;line-height:1.4;margin-top:.7rem}
.jc-act a{text-decoration:none}
.btn.done{background:var(--teal);border-color:var(--teal);color:#fff}
.note-line{font-size:.8rem;padding:.3rem 0;border-bottom:1px dashed var(--border)}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1rem}
.chips button{border:1px solid rgba(16,68,78,.18);background:#fff;border-radius:99px;padding:3px 11px;font-size:.78rem;color:var(--muted);cursor:pointer}
.chips button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.rem-list{margin-top:1rem;font-size:.84rem}
.rem-list>summary{cursor:pointer;color:var(--muted);font-size:.84rem;padding:.3rem 0}
.rem-list .table-wrap{margin-top:.5rem}
/* Review: invoice + email */
.flag{background:rgba(226,168,69,.14);border-radius:6px;padding:.45rem .65rem;font-size:.84rem;margin-bottom:.5rem;color:#5e4a0e}
.lab{display:block;font-size:.76rem;color:var(--muted);margin:.65rem 0 .2rem}
.in{width:100%;border:1px solid rgba(16,68,78,.2);border-radius:6px;padding:7px 9px;background:#fff;font:inherit;font-size:.88rem;color:var(--ink)}
textarea.in{resize:vertical;min-height:64px;line-height:1.45}
.in:focus{border-color:var(--teal-light)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.totals{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:.84rem;margin-top:.5rem}
.opts{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.84rem;margin:.2rem 0 .9rem}
.opts label{display:flex;gap:.35rem;align-items:center}
.who{display:flex;gap:.35rem;flex-wrap:wrap;margin:.3rem 0}
.who label{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(16,68,78,.18);border-radius:99px;padding:2px 10px 2px 7px;font-size:.78rem;cursor:pointer;background:#fff}
.who a{color:var(--teal);font-size:.72rem;text-decoration:none}
.line{display:grid;grid-template-columns:1fr 62px 92px 24px;gap:.35rem;margin-bottom:.3rem}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem}
.foot{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.save{font-size:.76rem;color:var(--muted);min-height:1.1em;margin-top:.45rem}
.save.err{color:var(--red);font-weight:600}
.btn.ghost{border-color:transparent;background:none}
.btn.warn{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ph{position:relative;display:block;cursor:pointer;margin:0}
.ph input{position:absolute;top:5px;left:5px;width:17px;height:17px;accent-color:var(--teal)}
.ph.off img{opacity:.3;filter:grayscale(1)}
@media (max-width:1100px){.pipe{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.two,.row2{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<main class="wrap" id="main">
  <div id="banner"></div>
  <div id="view"><p class="dim">Loading…</p></div>
</main>
<script type="module" src="invoicing-app.js"></script>
</body>
</html>
