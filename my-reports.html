<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — My Weekly Report</title>
<script src="auth.js"></script>
<script>if (typeof apGuard === "function") apGuard("my-reports");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- MY WEEKLY REPORT: every team member. Weekly report to leadership (team_reports), their monthly
     report cards once published (report_cards), and their exit survey when one is sent (exit_surveys).
     Leaders read it all in Team Hub > Team Reports. Definitions: team-reports-lib.js. -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#27636C;--teal-light:#3D818A;--teal-dark:#10444E;--purple:#6C5D8D;--purple-soft:#9B8EC4;--bg:#EAF2F3;--card:#FFFFFF;--grey:#5A7A80;--ink:#10444E;--amber:#A9821F;--red:#B83227;--green:#2E7D57;--border:rgba(16,68,78,0.12);--line:rgba(16,68,78,0.09)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:1.6rem 1.2rem 5rem}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.6rem,4vw,2.1rem);font-weight:700;text-transform:uppercase;line-height:1.1}
h2{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--grey);font-size:.92rem;margin-top:.35rem}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--border);margin:1.2rem 0 1.1rem;overflow-x:auto}
.tabs a{padding:.6rem .9rem;font:500 .92rem 'Inter',sans-serif;color:var(--grey);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.tabs a .dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--purple);color:#fff;font-size:.7rem;text-align:center;line-height:18px;margin-left:5px;padding:0 5px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(16,68,78,.05)}
.q{font-weight:600;margin-bottom:.15rem}
.hint{color:var(--grey);font-size:.84rem;margin-bottom:.6rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.scale button{font:500 .82rem 'Inter',sans-serif;border:1.5px solid rgba(16,68,78,.18);background:#fff;color:var(--ink);border-radius:9px;padding:.7rem .2rem;cursor:pointer;line-height:1.15}
.scale button:hover{border-color:var(--teal-light)}
.scale button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.scale button .n{display:block;font:700 1.05rem 'Oswald',sans-serif;margin-bottom:2px;opacity:.7}
textarea,input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid rgba(16,68,78,.22);border-radius:8px;padding:.6rem .7rem;width:100%}
textarea{min-height:92px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid rgba(39,99,108,.35);border-color:var(--teal)}
.count{text-align:right;font-size:.75rem;color:var(--grey);margin-top:.2rem}
.btn{font-family:'Oswald',sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:none;background:var(--teal);color:#fff;border-radius:8px;padding:.75rem 1.3rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--teal-light)}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid rgba(39,99,108,.35)}
.btn.sm{padding:.4rem .75rem;font-size:.74rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;align-items:center}
.weekbar b{font-family:'Oswald',sans-serif;font-size:1.05rem;letter-spacing:.03em}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:20px;padding:3px 10px;background:rgba(90,122,128,.14);color:var(--grey)}
.pill.ok{background:rgba(46,125,87,.14);color:var(--green)}
.pill.new{background:rgba(108,93,141,.14);color:var(--purple)}
.done-box{background:rgba(46,125,87,.08);border:1px solid rgba(46,125,87,.25);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1rem}
.hist{width:100%;border-collapse:collapse;font-size:.86rem}
.hist td,.hist th{padding:.5rem .4rem;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);font-weight:600}
.empty{color:var(--grey);text-align:center;padding:2rem 1rem}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:.7rem 1.1rem;border-radius:8px;font-size:.9rem;display:none;z-index:1000;max-width:92vw}
.toast.bad{background:var(--red)}
/* Report card */
.rc{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.2rem;box-shadow:0 2px 10px rgba(16,68,78,.07)}
.rc-head{background:linear-gradient(120deg,#0A2A30 0%,#10444E 55%,#27636C 100%);color:#fff;padding:1.1rem 1.25rem;display:flex;align-items:center;gap:1rem}
.rc-head img{height:46px;width:auto;flex:none}
.rc-head .t{flex:1}
.rc-head .t small{display:block;color:#9FD3D5;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-family:'Oswald',sans-serif}
.rc-head .t b{font-family:'Oswald',sans-serif;font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase}
.rc-grade{font:700 2.2rem 'Oswald',sans-serif;background:#fff;color:var(--teal-dark);border-radius:12px;min-width:74px;text-align:center;padding:.2rem .5rem;line-height:1.3}
.rc-grade small{display:block;font:600 .6rem 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);line-height:1}
.rc-body{padding:1.1rem 1.25rem 1.25rem}
.pr{display:grid;grid-template-columns:150px 1fr 92px;gap:.6rem;align-items:center;padding:.35rem 0}
.pr .nm{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:.9rem}
.bar{height:10px;border-radius:5px;background:rgba(16,68,78,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--purple-soft))}
.pr .w{font-size:.78rem;color:var(--grey);text-align:right}
.rc-sec{margin-top:1rem}
.rc-sec h3{font:600 .82rem 'Oswald',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:.3rem}
.rc-sec.good h3{color:var(--green)}
.rc-sec.grow h3{color:var(--amber)}
.rc-sec p{white-space:pre-wrap}
.rc-foot{border-top:1px solid var(--line);margin-top:1.1rem;padding-top:.9rem}
/* Exit survey */
.sv-q{margin-bottom:1.3rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips button{font:500 .84rem 'Inter',sans-serif;border:1.5px solid rgba(16,68,78,.18);background:#fff;color:var(--ink);border-radius:20px;padding:.45rem .85rem;cursor:pointer}
.chips button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.grid-q{width:100%;border-collapse:collapse;font-size:.84rem}
.grid-q td,.grid-q th{padding:.45rem .25rem;border-bottom:1px solid var(--line);text-align:center}
.grid-q td:first-child,.grid-q th:first-child{text-align:left;width:38%}
.grid-q th{font-size:.68rem;color:var(--grey);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.grid-q input{width:20px;height:20px;accent-color:var(--teal)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:.25rem}
.nps button{font:600 .9rem 'Oswald',sans-serif;border:1.5px solid rgba(16,68,78,.18);background:#fff;border-radius:7px;padding:.55rem 0;cursor:pointer;color:var(--ink)}
.nps button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.nps-ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--grey);margin-top:.25rem}
@media (max-width:560px){
  .wrap{padding:1rem .75rem 4rem}
  .scale{gap:.25rem}.scale button{font-size:.72rem;padding:.6rem .1rem}
  .pr{grid-template-columns:1fr auto;gap:.15rem .6rem}.pr .bar{grid-column:1/-1;grid-row:2}.pr .w{grid-row:1;grid-column:2}
  .grid-q th{font-size:.58rem}
  .nps button{font-size:.78rem}
  .rc-head img{height:34px}
}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="empty">Loading…</div></main>
<div class="toast" id="toast"></div>
<script type="module" src="my-reports-app.js?v=1"></script>
</body>
</html>
