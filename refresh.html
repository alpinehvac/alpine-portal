<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — BuildOps Refresh</title>
<script src="auth.js"></script>
<script>apGuard("service-agreements");</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#111110;color:#fff;font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:2.5rem 1.5rem}
h1{font-family:'Oswald',sans-serif;font-size:2rem;text-transform:uppercase;line-height:1.1}
p{color:rgba(16,68,78,0.78);font-size:.9rem;margin:.5rem 0 1.25rem}
.card{border:1px solid rgba(16,68,78,0.112);border-radius:14px;background:#FFFFFF;padding:1.25rem 1.4rem;margin-bottom:1rem}
.row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid rgba(16,68,78,0.07);font-size:.88rem}
.row:last-child{border-bottom:none}
.row b{font-family:'Oswald',sans-serif;font-size:1.1rem}
.btn{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:.6rem 1.2rem;cursor:pointer;border:1px solid #27636C;background:#27636C;color:#fff;text-decoration:none;display:inline-block}
.btn.ghost{background:none;border-color:rgba(16,68,78,0.28);color:rgba(16,68,78,0.92)}
.log{font-size:.8rem;color:rgba(16,68,78,0.78);white-space:pre-wrap}
.ok{color:#2E7D57}.warn{color:#A9821F}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<main class="wrap">
  <h1>BuildOps refresh</h1>
  <p>Applies a BuildOps pull to the Agreement Tracker, Site Reports and site pages. BuildOps fields are refreshed; anything entered in the portal (renewal notes, checklist marks, CLEAR reports, sent/reviewed) is never overwritten.</p>
  <div id="out" class="card"><p style="margin:0">Loading…</p></div>
  <a class="btn ghost" href="dashboard.html">Dashboard</a>
</main>
<script>
  window.AP_SYNC_COLLECTION = "service_agreements_data";
  window.AP_SYNC_ROUTES = { "sr_": "site_reports_data", "st_": "site_data" };
  window.AP_APP_SCRIPT = "refresh-app.js";
</script>
<script type="module" src="cloud-sync.js"></script>
</body>
</html>
