<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine HVAC — Site</title>
<script src="auth.js"></script>
<script>apGuard("site-reports");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#1C6B6E;--teal-light:#2A8A8E;--purple-light:#B8AEDC;--black:#111110;--off-black:#1A1A18;--charcoal:#2A2A28;--white:#fff;
  --red:#E0705F;--amber:#D9A441;--green:#5FB38A;--border:rgba(255,255,255,0.08);--radius:8px;--radius-lg:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--black);color:var(--white);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}
a{color:var(--teal-light)}
.topbar{position:sticky;top:0;z-index:300;background:var(--black);border-bottom:1px solid rgba(28,107,110,0.35);display:flex;align-items:center;gap:.5rem;padding:0 1rem;min-height:56px;flex-wrap:wrap}
.bar-btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.55);border-radius:4px;padding:0 12px;height:32px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.bar-btn:hover{color:var(--teal-light);border-color:rgba(28,107,110,0.6)}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,0.15);border-radius:6px;overflow:hidden}
.seg button{background:none;border:none;padding:.42rem .95rem;font-size:.82rem;cursor:pointer;color:rgba(255,255,255,0.6)}
.seg button.on{background:var(--teal);color:#fff}
.sel,.inp{background:var(--charcoal);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:.4rem .6rem;font-size:.83rem}
.spacer{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:2rem 1.5rem 5rem}
.kicker{font-size:.8rem;color:rgba(255,255,255,0.45)}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;text-transform:uppercase;line-height:1.1;margin:.2rem 0}
.sub{font-size:.88rem;color:rgba(255,255,255,0.55)}
h2{font-family:'Oswald',sans-serif;font-size:1.02rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:.6rem;margin:2rem 0 .75rem}
h2 .note{font-family:'Inter',sans-serif;font-size:.76rem;font-weight:400;text-transform:none;letter-spacing:0;color:rgba(255,255,255,0.4)}
.muted{color:rgba(255,255,255,0.42)}
.btn{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:.45rem .9rem;cursor:pointer;border:1px solid rgba(255,255,255,0.15);background:none;color:rgba(255,255,255,0.75)}
.btn:hover{border-color:rgba(255,255,255,0.35);color:#fff}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:.25rem .55rem;font-size:10px}
.badge{display:inline-block;font-size:.7rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.b-red{background:rgba(224,112,95,0.18);color:var(--red)}.b-amber{background:rgba(217,164,65,0.16);color:var(--amber)}
.b-green{background:rgba(95,179,138,0.16);color:var(--green)}.b-grey{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5)}
.b-teal{background:rgba(42,138,142,0.2);color:#8FC6C8}

.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-top:1.25rem}
.counts > div{background:var(--off-black);padding:.9rem 1.1rem}
.counts b{display:block;font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:600;line-height:1.2}
.counts span{font-size:.75rem;color:rgba(255,255,255,0.45)}
.bucket{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--off-black);overflow:hidden}
.job{padding:.85rem 1.1rem;border-bottom:1px solid rgba(255,255,255,0.05)}
.job:last-child{border-bottom:none}
.job-top{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;font-size:.82rem}
.job-top a{font-family:'Oswald',sans-serif;text-decoration:none;letter-spacing:.02em}
.job-title{font-weight:500;margin-top:.2rem}
.visits{list-style:none;margin-top:.4rem;display:flex;flex-direction:column;gap:.3rem;font-size:.8rem;color:rgba(255,255,255,0.72)}
.visits li{display:grid;grid-template-columns:105px 1fr;gap:.6rem}
.visits b{color:#fff;font-weight:500}
.visits .eq{color:rgba(255,255,255,0.42);font-size:.74rem}
.empty{padding:1.25rem 1.1rem;color:rgba(255,255,255,0.4);font-size:.85rem}

/* CLEAR editor */
.clear-bar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--off-black);padding:.85rem 1.1rem;margin-top:1.25rem}
.chk{display:flex;align-items:center;gap:.45rem;font-size:.84rem;cursor:pointer;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:.35rem .7rem}
.chk input{width:16px;height:16px;accent-color:var(--teal-light)}
.chk.on{border-color:rgba(95,179,138,0.5);background:rgba(95,179,138,0.08)}
.chk small{color:rgba(255,255,255,0.45);font-size:.72rem}
.rygsum{display:flex;gap:.4rem}
.asset{display:grid;grid-template-columns:88px 1fr 210px;gap:1rem;border:1px solid var(--border);border-left:4px solid var(--green);border-radius:var(--radius);background:var(--off-black);padding:.8rem 1rem;margin-top:.55rem}
.asset.yellow{border-left-color:var(--amber)}.asset.red{border-left-color:var(--red)}.asset.off{opacity:.45}
.asset img{width:88px;height:88px;object-fit:cover;border-radius:6px;background:#222}
.a-tag{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600}
.a-meta{font-size:.76rem;color:rgba(255,255,255,0.5)}
.a-desc{font-size:.8rem;color:rgba(255,255,255,0.7);margin-top:.15rem}
.asset textarea{width:100%;min-height:58px;margin-top:.45rem;font-size:.8rem;resize:vertical}
.ryg{display:flex;gap:4px}
.ryg button{flex:1;border:1px solid rgba(255,255,255,0.14);background:none;border-radius:5px;padding:.3rem 0;font-size:.74rem;cursor:pointer;color:rgba(255,255,255,0.5)}
.ryg button.g.on{background:rgba(95,179,138,0.3);color:#fff;border-color:var(--green)}
.ryg button.y.on{background:rgba(217,164,65,0.3);color:#fff;border-color:var(--amber)}
.ryg button.r.on{background:rgba(224,112,95,0.32);color:#fff;border-color:var(--red)}
.a-side{display:flex;flex-direction:column;gap:.45rem;font-size:.76rem}
.a-side label{color:rgba(255,255,255,0.45)}
.a-side input[type=number]{width:70px}
.auto{font-size:.68rem;color:var(--purple-light)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--charcoal);border:1px solid rgba(28,107,110,0.6);border-radius:8px;padding:.65rem 1rem;font-size:.83rem;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* printable CLEAR report */
#print-root{display:none}
@media print{
  @page{size:letter;margin:12mm}
  body{background:#fff;color:#1d2226}
  .topbar,.wrap,.toast{display:none!important}
  #print-root{display:block}
  .pr-top{display:flex;justify-content:space-between;border-bottom:3px solid #1A6B6B;padding-bottom:8px;margin-bottom:12px}
  .pr-brand{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1A6B6B;font-size:13pt}
  .pr-brand small{display:block;font-weight:400;font-size:7pt;letter-spacing:.14em;color:#6b6f73}
  .pr-title{font-family:'Oswald',sans-serif;font-size:20pt;font-weight:600;text-transform:uppercase;line-height:1.1;margin-top:6px}
  .pr-meta{font-size:9pt;color:#3d4348}
  .pr-sum{display:flex;gap:10px;margin:10px 0 6px}
  .pr-sum div{flex:1;border-radius:6px;padding:8px 10px;font-size:9pt}
  .pr-sum b{display:block;font-family:'Oswald',sans-serif;font-size:18pt;line-height:1}
  .pr-sum .r{background:#FCE9E6;color:#9B2D20}.pr-sum .y{background:#FBF2DC;color:#8A5A00}.pr-sum .g{background:#E5F4EC;color:#1E6B45}
  .pr-legend{font-size:8pt;color:#6b6f73;margin-bottom:8px}
  .pr-h{font-family:'Oswald',sans-serif;font-size:11pt;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#1A6B6B;margin:12px 0 6px}
  .pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pr-card{display:grid;grid-template-columns:70px 1fr;gap:8px;border:1px solid #dde2e3;border-left:5px solid #2E9E64;border-radius:6px;padding:7px;break-inside:avoid;font-size:8.5pt}
  .pr-card.yellow{border-left-color:#D99A1E}.pr-card.red{border-left-color:#D2452F}
  .pr-card img{width:70px;height:70px;object-fit:cover;border-radius:4px}
  .pr-card .t{font-family:'Oswald',sans-serif;font-size:11pt;font-weight:600}
  .pr-card .m{color:#6b6f73;font-size:7.5pt}
  .pr-card .n{margin-top:3px;color:#1d2226}
  .pr-pill{display:inline-block;font-size:7pt;font-weight:700;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:middle}
  .pr-pill.green{background:#E5F4EC;color:#1E6B45}.pr-pill.yellow{background:#FBF2DC;color:#8A5A00}.pr-pill.red{background:#FCE9E6;color:#9B2D20}
  .pr-foot{margin-top:14px;border-top:1px solid #dde2e3;padding-top:6px;font-size:7.5pt;color:#6b6f73;display:flex;justify-content:space-between}
}
@media (max-width:760px){.counts{grid-template-columns:1fr 1fr}.asset{grid-template-columns:64px 1fr}.asset img{width:64px;height:64px}.a-side{grid-column:1/-1}}
</style>
</head>
<body>
<div class="topbar">
  <a class="bar-btn" id="lnk-back" href="site-reports.html">← Site Reports</a>
  <div class="seg" role="group" aria-label="View">
    <button data-view="activity" class="on">Activity</button>
    <button data-view="clear">CLEAR report</button>
  </div>
  <select class="sel" id="pick-q" aria-label="Quarter"></select>
  <span class="spacer"></span>
  <a class="bar-btn" id="lnk-bo" href="#" target="_blank" rel="noopener">Open in BuildOps ↗</a>
  <a class="bar-btn" href="dashboard.html">🏠 Dashboard</a>
</div>
<main class="wrap" id="main"><p class="muted">Loading…</p></main>
<div id="print-root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
  window.AP_SYNC_COLLECTION = "site_data";
  window.AP_APP_SCRIPT = "site-app.js";
</script>
<script type="module" src="cloud-sync.js"></script>
</body>
</html>
