<!-- ALPINE TECH MOBILE (My Visits): the phone app for field techs. Add to Home Screen on iPhone/iPad.
     Contains NO job data: everything loads from Firestore after sign-in.
       fs_visits/{id}    one visit: customer, site, address, site contact, scope, equipment notes, date/time,
                         techEmails[] (who is assigned), status (scheduled / in_progress / complete). Office creates.
       fs_time/{id}      hours a tech logged against a visit (tech = their email)
       fs_summaries/{id}              dated entries in a visit summary
       fs_photos/{id}    one compressed photo per doc (until Firebase Storage is on)
     Techs see and write only their own work (firestore.rules). Owners + field_ops see everything and add visits.
     Works with no signal: saves wait on the phone and upload when back in coverage; the screen says which.
     Try it without signing in: tech.html?demo=1 (sample visits, nothing is saved). -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#27636C;--teal-light:#3D818A;--teal-dark:#10444E;
  --bg:#EAF2F3;--card:#FFFFFF;--ink:#10444E;--muted:#5A7A80;
  --amber:#A9821F;--red:#B83227;--green:#2E7D57;
  --border:rgba(16,68,78,0.13);--r:14px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html,body{min-height:100%;background:var(--bg)}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(var(--sb) + 2rem)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--teal-light);outline-offset:2px}

header{position:sticky;top:0;z-index:50;background:var(--teal-dark);color:#fff;padding:calc(var(--st) + .55rem) 1rem .6rem;display:flex;align-items:center;gap:.7rem}
header h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:.72rem;letter-spacing:0;text-transform:none;opacity:.8}
.hbtn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;min-width:44px;height:40px;padding:0 .7rem;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.35rem}
.hbtn:active{background:rgba(255,255,255,.25)}
.sync{font-size:.72rem;display:flex;align-items:center;gap:.35rem;white-space:nowrap;opacity:.95}
.sync i{width:9px;height:9px;border-radius:50%;background:#7FD1A6;display:inline-block}
.sync.wait i{background:#F2C25B}.sync.off i{background:#F28B7D}

.wrap{max-width:640px;margin:0 auto;padding:1rem}
.banner{border-radius:10px;padding:.7rem .9rem;font-size:.88rem;margin-bottom:1rem;background:rgba(42,138,142,.12);border:1px solid rgba(42,138,142,.4);color:var(--teal-dark)}
.banner.warn{background:rgba(226,168,69,.14);border-color:rgba(226,168,69,.55);color:#6B5210}
.banner.err{background:rgba(224,112,94,.1);border-color:rgba(224,112,94,.5);color:var(--red)}
.banner b{font-weight:600}

.tabs{display:flex;background:rgba(16,68,78,.08);border-radius:12px;padding:4px;gap:4px;margin-bottom:1rem}
.tabs button{flex:1;border:none;background:none;border-radius:9px;padding:.6rem .4rem;font-weight:500;font-size:.92rem;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,68,78,.15)}
.tabs button span{font-size:.75rem;opacity:.75;margin-left:.2rem}
.tools{display:flex;gap:.5rem;align-items:center;margin-bottom:.9rem;flex-wrap:wrap}
.tools label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}

.day{font-family:'Oswald',sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:1.1rem 0 .5rem}
.day:first-child{margin-top:0}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;text-decoration:none;color:inherit}
.card:active{background:#F4F9F9}
.card .top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.card .time{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:500}
.card .cust{font-weight:600;font-size:1.02rem;margin-top:.15rem}
.card .site{font-size:.88rem;color:var(--muted)}
.card .desc{font-size:.88rem;margin-top:.35rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .who{font-size:.78rem;color:var(--muted);margin-top:.35rem}
/* Visit status colours: tile tint, border, strong (bar) colour. Shared by .vc cards and the detail .chip */
.scheduled{--st-tile:#E6F4EC;--st-border:#9FD1B4;--st-bar:#2E7D57}
.in_progress{--st-tile:#FDF0DC;--st-border:#EBC17A;--st-bar:#D98A1C}
.overdue{--st-tile:#FBE5E3;--st-border:#E9A59E;--st-bar:#B83227}
.complete{--st-tile:#EEF1F2;--st-border:#CCD5D7;--st-bar:#8A9A9E}
.chip{display:inline-block;font-size:.74rem;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--st-tile);border:1px solid var(--st-border);color:var(--st-bar)}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem;font-size:.95rem}

/* Visit */
.back{border:none;background:none;color:var(--teal);font-weight:500;padding:.3rem 0;margin-bottom:.6rem;cursor:pointer;font-size:.95rem}
.vhead h2{font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:600;line-height:1.15;text-transform:uppercase}
.vhead .site{color:var(--muted);margin-top:.2rem}
.vhead .meta{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.55rem;font-size:.85rem;color:var(--muted)}
.statusbar{display:flex;gap:.6rem;margin:1rem 0 1.2rem}
.big{flex:1;border:none;border-radius:12px;min-height:52px;font-weight:600;font-size:1rem;cursor:pointer;background:var(--teal);color:#fff}
.big:active{background:var(--teal-dark)}
.big.ghost{background:var(--card);color:var(--ink);border:1px solid var(--border)}
.big.done{background:var(--green)}
.big:disabled{opacity:.5}
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:.9rem}
.sec h3{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.55rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.sec h3 .st{font-size:.75rem;letter-spacing:0;text-transform:none;font-weight:500}
.row{display:flex;gap:.8rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:none;padding-top:0}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:.8rem}
.act{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:10px;background:rgba(39,99,108,.1);color:var(--teal);text-decoration:none;font-weight:600;font-size:.85rem;padding:0 .8rem;border:none;cursor:pointer}
.pre{white-space:pre-line;font-size:.95rem}
ul.eq{list-style:none}
ul.eq li{padding:.35rem 0;border-top:1px solid var(--border);font-size:.92rem}
ul.eq li:first-child{border-top:none}
ul.eq small{color:var(--muted)}

.field{display:block;margin-bottom:.7rem}
.field>span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.25rem}
.inp{width:100%;border:1px solid rgba(16,68,78,.25);border-radius:10px;padding:.7rem .75rem;background:#fff;font-size:16px}
textarea.inp{min-height:140px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stepper{display:flex;align-items:center;gap:.4rem}
.stepper button{width:48px;height:48px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:1.3rem;cursor:pointer}
.stepper input{text-align:center;font-family:'Oswald',sans-serif;font-size:1.3rem;font-weight:500}
.btnrow{display:flex;gap:.6rem;align-items:center}
.btnrow .big{min-height:48px}
.saved{font-size:.8rem;color:var(--muted);margin-top:.4rem;min-height:1.1em}
.saved.ok{color:var(--green)}.saved.wait{color:var(--amber)}.saved.bad{color:var(--red)}
.hrs-total{font-family:'Oswald',sans-serif;font-size:1.1rem}
.del{border:none;background:none;color:var(--red);font-size:.82rem;padding:.4rem;cursor:pointer}

.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.ph figure{position:relative;margin:0}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:rgba(16,68,78,.08)}
.ph figcaption{font-size:.7rem;color:var(--muted);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{font-size:.78rem;color:var(--muted);margin-top:.3rem}
.sumlog{margin-bottom:.6rem}
.sument{border-left:3px solid var(--border);padding:.35rem 0 .35rem .65rem;margin:.4rem 0}
.sument.mine{border-left-color:var(--teal-light)}
.n-del[data-fix-sum]{color:var(--teal);font-weight:600;font-size:.8rem}
.ph .badge{position:absolute;left:5px;top:5px;font-size:.66rem;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 6px}
.ph .badge.bad{background:var(--red)}
.ph .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:.9rem;cursor:pointer}
.addph{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;min-height:52px;border:2px dashed rgba(39,99,108,.45);border-radius:12px;color:var(--teal);font-weight:600;background:rgba(39,99,108,.04);cursor:pointer;margin-top:.6rem}

/* Sheet (office: new visit) */
.sheet{position:fixed;inset:0;background:rgba(10,42,48,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:1rem 1rem calc(var(--sb) + 1rem)}
.sheet h3{font-family:'Oswald',sans-serif;font-size:1.2rem;text-transform:uppercase;margin-bottom:.8rem}
.checks{display:flex;flex-wrap:wrap;gap:.4rem}
.checks label{display:flex;align-items:center;gap:.35rem;background:#fff;border:1px solid var(--border);border-radius:20px;padding:.4rem .75rem;font-size:.88rem}

.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 1rem);transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:.7rem 1rem;border-radius:12px;font-size:.9rem;z-index:100;display:none;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--red)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,330px);background:#F8FAFA;z-index:95;transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column;padding:calc(var(--st) + 1rem) .9rem calc(var(--sb) + 1rem);overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.drawer .me{display:flex;gap:.8rem;align-items:center;padding:.3rem .2rem 1rem;border-bottom:1px solid var(--border)}
.drawer .av{width:48px;height:48px;border-radius:50%;background:var(--teal-light);color:#fff;font-weight:600;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex:none}
.drawer .me b{display:block;font-size:1.05rem}
.drawer .me small{display:block;color:var(--muted);font-size:.82rem;word-break:break-all}
.drawer .dl{padding:.6rem 0;border-bottom:1px solid var(--border)}
.drawer .dl a,.drawer .dl button{display:block;width:100%;text-align:left;border:none;background:none;padding:.8rem .8rem;border-radius:10px;font-size:1.05rem;text-decoration:none;color:var(--ink);cursor:pointer}
.drawer .dl a.on{background:rgba(39,99,108,.14);color:var(--teal-dark);font-weight:600}
.drawer .out{margin-top:1.2rem;border:1px solid rgba(16,68,78,.3);background:#fff;border-radius:24px;padding:.8rem;font-weight:600;font-size:1rem;cursor:pointer}
.drawer .ver{margin-top:auto;padding-top:1rem;text-align:right;color:var(--muted);font-size:.78rem}
/* Equipment */
.unit{border-top:1px solid var(--border);padding:.15rem 0}
.unit:first-child{border-top:none}
.unit summary{list-style:none;display:flex;gap:.7rem;align-items:flex-start;padding:.6rem 0;cursor:pointer}
.unit summary::-webkit-details-marker{display:none}
.unit summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:1.3rem;line-height:1;transition:transform .15s}
.unit[open] summary::after{transform:rotate(90deg)}
.u-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.05rem;min-width:4.2rem}
.u-sum{font-size:.86rem;color:var(--muted);flex:1;min-width:0}
.u-old{background:rgba(217,164,54,.2);color:#7A5C0E;border-radius:20px;padding:2px 8px;font-size:.72rem;font-weight:600;white-space:nowrap;align-self:center}
.u-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem .9rem;padding:0 0 .4rem}
.u-grid div{display:flex;flex-direction:column;font-size:.9rem}
.u-grid span{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.u-notes{background:rgba(217,164,54,.12);border-left:3px solid #D9A436;border-radius:6px;padding:.5rem .7rem;font-size:.88rem;white-space:pre-line;margin-top:.3rem}
.owner-only{display:none!important}
body.owner .owner-only{display:block!important}
/* Time clock */
.clock{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin:1rem 0 1.2rem;text-align:center}
.clock.travel{border-color:#7FB3D9;background:#F1F7FC}.clock.work{border-color:rgba(46,125,87,.45);background:#F1FAF5}
.clock.lunch,.clock.coffee{border-color:rgba(217,164,54,.6);background:#FFF8E9}
.clock .cl-state{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clock .cl-time{font-family:'Oswald',sans-serif;font-size:2.6rem;font-weight:500;line-height:1.1;margin:.15rem 0;font-variant-numeric:tabular-nums}
.cl-sub{font-size:.84rem;color:var(--muted)}
.clock .big{width:100%;margin-top:.7rem}
.clock .cl-row{display:flex;gap:.6rem}.clock .cl-row.two .big{flex:1}
.clock.idle .cl-row:first-child .big{margin-top:0}
.linkbtn{display:block;width:100%;border:none;background:none;color:var(--teal);font-weight:500;padding:.8rem 0 .1rem;cursor:pointer;font-size:.92rem}
.u-notes .n-lbl{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#7A5C0E;margin-bottom:.15rem}
.u-warn{background:rgba(184,50,39,.12);color:var(--red)}
.u-nc{background:rgba(39,99,108,.1);color:var(--teal);border-radius:20px;padding:2px 8px;font-size:.72rem;font-weight:600;white-space:nowrap;align-self:center}
.notes{margin-top:.4rem}
.note{border-left:3px solid var(--border);padding:.35rem 0 .35rem .65rem;margin:.35rem 0}
.note.warn{border-left-color:var(--red);background:rgba(184,50,39,.06);border-radius:0 6px 6px 0}
.n-head{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.n-head b{color:var(--ink,#1d2b30)}
.n-ago{color:var(--muted);font-size:.74rem;margin-left:.2rem}
.n-text{font-size:.9rem;white-space:pre-line;margin-top:.1rem}
.n-del{margin-left:auto;border:none;background:none;color:var(--muted);font-size:.9rem;padding:.2rem .4rem;cursor:pointer}
.site-notes{margin-top:.9rem;border-top:1px solid var(--border);padding-top:.6rem}
.sn-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.92rem}
.warnbox{background:rgba(184,50,39,.08);border:1px solid rgba(184,50,39,.35);border-radius:10px;padding:.6rem .75rem;margin-bottom:.7rem;font-size:.88rem;color:#5c1a14}
.warnbox>b{display:block;color:var(--red);margin-bottom:.25rem}
.warnbox div{margin:.25rem 0}
.tog{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem 0;border-top:1px solid var(--border)}
.tog:first-of-type{border-top:none;padding-top:0}
.tog input{width:22px;height:22px;margin-top:.1rem;accent-color:var(--teal);flex:none}
.tog small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.office-only{display:none!important}
body.office .office-only{display:block!important}

/* BuildOps-style list */
.toptabs{display:flex;margin:-1rem -1rem 1rem;background:var(--card);border-bottom:1px solid var(--border)}
.toptabs button{flex:1;border:none;background:none;padding:.85rem .5rem .75rem;font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;letter-spacing:.02em;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.toptabs button.on{color:var(--teal-dark);border-bottom-color:var(--teal-dark)}
.toptabs button span{font-family:'Inter',sans-serif;font-size:.75rem;font-weight:500;margin-left:.3rem;opacity:.8}
.search{position:relative;margin-bottom:.9rem}
.search input{width:100%;border:1px solid rgba(16,68,78,.3);border-radius:10px;padding:.75rem .8rem .75rem 2.4rem;font-size:16px;background:#fff}
.search::before{content:"⌕";position:absolute;left:.8rem;top:50%;transform:translateY(-52%);font-size:1.25rem;color:var(--muted)}
.dayh{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);padding:.9rem 0 .4rem;border-bottom:1px solid var(--border);margin-bottom:.6rem}
.vc{display:flex;gap:.8rem;background:var(--st-tile,var(--card));border:1px solid var(--st-border,var(--border));border-radius:var(--r);padding:.85rem .95rem .85rem .75rem;margin-bottom:.6rem;text-decoration:none;color:inherit}
.vc:active{filter:brightness(.96)}
.vc .bar{width:6px;border-radius:4px;flex:none;background:var(--st-bar,var(--teal-light))}
.vc .body{flex:1;min-width:0}
.vc .l1{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.od{background:#9B0F0F;color:#fff;border-radius:20px;padding:2px 10px;font-size:.78rem;font-weight:600}
.vc .ty{font-size:.88rem;color:var(--muted);margin-top:.3rem}
.vc .mid{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.vc .ti{font-weight:700;font-size:1.08rem;line-height:1.25;margin-top:.1rem}
.vc .tm{text-align:right;white-space:nowrap;font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:500}
.vc .tm small{display:block;font-family:'Inter',sans-serif;font-size:.8rem;color:var(--muted);font-weight:400}
.vc .sub{font-size:.85rem;color:var(--muted);margin-top:.25rem}
.fab{position:fixed;right:1.1rem;bottom:calc(var(--sb) + 1.2rem);width:60px;height:60px;border-radius:50%;background:var(--teal-dark);color:#fff;border:none;font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:40}
.ts-week{margin-bottom:1rem}
.ts-week h3{display:flex;justify-content:space-between}
/* Schedule (#schedule): Week / 2 Weeks rows and Month grid. Status colours come from .scheduled/.in_progress/.overdue/.complete */
.snav{display:flex;align-items:center;gap:.4rem;margin-bottom:.7rem}
.snav h2{flex:1;min-width:0;text-align:center;font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:500;letter-spacing:.03em;text-transform:uppercase}
.snav button{border:1px solid var(--border);background:var(--card);border-radius:10px;min-width:44px;height:40px;font-size:1.35rem;line-height:1;color:var(--teal-dark);cursor:pointer}
.snav .tdy{font-size:.85rem;padding:0 .7rem}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.8rem;color:var(--muted);margin-bottom:.9rem}
.legend span{display:flex;align-items:center;gap:.35rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--st-bar);display:inline-block;flex:none}
.sd{display:flex;gap:.7rem;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.55rem .7rem;margin-bottom:.45rem}
.sd.today{border:2px solid var(--teal);padding:calc(.55rem - 1px) calc(.7rem - 1px)}
.sd-h{width:3rem;flex:none;text-align:center;font-family:'Oswald',sans-serif;line-height:1.1;align-self:center}
.sd-h small{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sd-h b{display:block;font-size:1.35rem;font-weight:500}
.sd.today .sd-h,.sd.today .sd-h small{color:var(--teal)}
.sd-v{flex:1;min-width:0;display:flex;flex-direction:column;gap:.35rem;justify-content:center}
.sd-none{font-size:.85rem;color:var(--muted)}
.sc{display:block;background:var(--st-tile);border:1px solid var(--st-border);border-left:4px solid var(--st-bar);border-radius:8px;padding:.35rem .55rem;font-size:.86rem;text-decoration:none;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font-weight:600;margin-right:.4rem}
.wk-gap{height:.7rem}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.45rem}
.mg .wd{font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:.15rem 0 .3rem}
.mg button{border:none;background:none;border-radius:10px;min-height:54px;padding:.25rem 0;display:flex;flex-direction:column;align-items:center;gap:.2rem;cursor:pointer;color:var(--ink)}
.mg button.out{opacity:.4}
.mg button.sel{background:rgba(39,99,108,.13)}
.mg .n{width:1.85rem;height:1.85rem;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.9rem}
.mg .today .n{border:2px solid var(--teal);color:var(--teal);font-weight:600}
.mg .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:.62rem;line-height:8px;color:var(--muted)}
.sl{display:flex;gap:.8rem;align-items:flex-start;background:var(--st-tile);border:1px solid var(--st-border);border-left:5px solid var(--st-bar);border-radius:10px;padding:.6rem .75rem;margin-bottom:.45rem;text-decoration:none;color:var(--ink)}
.sl .t{font-family:'Oswald',sans-serif;font-weight:500;width:4.4rem;flex:none}
.sl .w{flex:1;min-width:0}
.sl b{display:block;font-weight:600}
.sl small{display:block;color:var(--muted);font-size:.82rem}
.menu{position:absolute;right:.8rem;top:calc(var(--st) + 3.3rem);background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);overflow:hidden;display:none;min-width:200px}
.menu.on{display:block}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:.85rem 1rem;border:none;background:none;text-decoration:none;color:inherit;font-size:.95rem;cursor:pointer;border-top:1px solid var(--border)}
.menu :first-child{border-top:none}
</style>
